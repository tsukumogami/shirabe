# Project tools managed by tsuku.
# See: https://tsuku.dev/docs/project-config
[tools]
# koto is pinned to an exact release, not "latest". /scope and /execute enter
# through scripts/koto-open.sh, which needs the koto init entry flags
# (--vars-file, --attach-live, --replace-terminal, --koto-leg), and the
# templates' context_assignments only execute from this release on. Every
# workflow that runs koto installs it from this line and then runs
# scripts/assert-koto-pin.sh, so CI tests exactly this release. Move the pin
# when shirabe adopts a koto feature from a newer release, in the same pull
# request that adopts it.
"tsukumogami/koto" = "0.13.0"
# gh = "latest"  # disabled: segfaults on Linux (tsukumogami/tsuku#2245)
