name: Build and Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        # SHA pin for dtolnay/rust-toolchain@stable (resolved from the stable branch HEAD).
        # The action reads rust-toolchain.toml at the repo root and installs the pinned channel.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo build (release)
        run: cargo build --release

      # The setup script niwa runs in each product repository clone on every
      # apply, scripts/setup/shirabe-pre-commit.sh, driven through each case
      # it decides in throwaway repositories, against the binary just built:
      # the hook it installs is the one this commit's install-hooks writes.
      - name: Pre-commit setup script suite
        run: PATH="$PWD/target/release:$PATH" bash scripts/shirabe-pre-commit_test.sh

      # The check the reusable lifecycle workflow runs in each repository that
      # carries a copy of the setup script, against this commit's canonical copy.
      - name: Setup script copy check suite
        run: bash scripts/check-setup-script-copy_test.sh

      # The posture-to-mode resolution behind the reusable lifecycle workflow's
      # `posture` input. shirabe's own caller uses `auto`, so this suite is the
      # only place the `draft` path runs in this repository's CI.
      - name: Lifecycle posture resolution suite
        run: bash scripts/lifecycle-posture-mode_test.sh

      # The plugin's pre-action hook, run through the command hooks/hooks.json
      # declares, against the binary just built. This workflow runs on every
      # pull request, so it covers every path a change to the hook can come
      # from: hooks/, crates/, the registry and the conformance reference.
      - name: Pre-action hook suite
        run: PATH="$PWD/target/release:$PATH" bash hooks/pre-action-deny_test.sh

      - name: Cargo test (workspace)
        run: cargo test --workspace
