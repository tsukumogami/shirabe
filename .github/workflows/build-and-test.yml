name: Build and Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        # SHA pin for dtolnay/rust-toolchain@stable (resolved from the stable branch HEAD).
        # The action reads rust-toolchain.toml at the repo root and installs the pinned channel.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo build (release)
        run: cargo build --release

      # The setup script niwa runs in each product repository clone on every
      # apply, scripts/setup/shirabe-pre-commit.sh, driven through each case
      # it decides in throwaway repositories, against the binary just built:
      # the hook it installs is the one this commit's install-hooks writes.
      - name: Pre-commit setup script suite
        run: PATH="$PWD/target/release:$PATH" bash scripts/shirabe-pre-commit_test.sh

      # The check the reusable lifecycle workflow runs in each repository that
      # carries a copy of the setup script, against this commit's canonical copy.
      - name: Setup script copy check suite
        run: bash scripts/check-setup-script-copy_test.sh

      # The posture-to-mode resolution behind the reusable lifecycle workflow's
      # `posture` input. shirabe's own caller uses `auto`, so this suite is the
      # only place the `draft` path runs in this repository's CI.
      - name: Lifecycle posture resolution suite
        run: bash scripts/lifecycle-posture-mode_test.sh

      # The plugin's pre-action hook, run through the command hooks/hooks.json
      # declares, against the binary just built. This workflow runs on every
      # pull request, so it covers every path a change to the hook can come
      # from: hooks/, crates/, the registry and the conformance reference.
      - name: Pre-action hook suite
        run: PATH="$PWD/target/release:$PATH" bash hooks/pre-action-deny_test.sh

      # The question guard, hooks/question-guard.sh, run through the command
      # hooks/hooks.json declares against the fixtures copied from the
      # harness's own hook inputs and session records.
      - name: Question guard suite
        run: PATH="$PWD/target/release:$PATH" bash hooks/question-guard_test.sh

      # The compaction note writer, scripts/handoff-brief.sh note, against a
      # stub koto, and the two `shirabe compaction` hooks reading back what it
      # wrote, against the binary just built; then the brief a run hands
      # forward, handoff-brief.sh write and read, against a file-backed koto
      # stand-in and a gh stand-in.
      - name: Compaction note and hooks suite
        run: PATH="$PWD/target/release:$PATH" bash scripts/handoff-brief_test.sh

      # The closing step a run takes before its brief, scripts/closing-step.sh,
      # against a throwaway clone pushed to a local bare remote.
      - name: Closing step suite
        run: bash scripts/closing-step_test.sh

      # The context reader, scripts/context-size.sh, against synthetic
      # transcripts, and the thrash check, scripts/thrash-check.sh, against
      # the reports it prints.
      - name: Context reader and thrash check suites
        run: |
          bash scripts/context-size_test.sh
          bash scripts/thrash-check_test.sh

      - name: Install tsuku
        uses: tsukumogami/tsuku/.github/actions/setup-tsuku@d45bd520886554384942a6e017908bdf6b8cf0b9  # installs tsuku 0.15.2

      - name: Install project tools
        env:
          TSUKU_TELEMETRY: "0"
          GITHUB_TOKEN: ${{ github.token }}
        run: tsuku install -y

      - name: Assert koto meets the floor
        run: bash scripts/assert-koto-floor.sh

      # The secret shapes built into `shirabe question raise` equal the
      # public-content check's own copy.
      - name: Secret shapes consistency
        run: bash scripts/secret-shapes-consistency_test.sh

      # `shirabe question` against the real koto: the recipient, the attempt
      # basis, the twenty-question limit and the checks koto makes of a
      # recorded question prompt before it records the owner's answer.
      - name: Question commands suite
        run: PATH="$PWD/target/release:$PATH" bash scripts/question-commands_test.sh

      - name: Cargo test (workspace)
        run: cargo test --workspace
