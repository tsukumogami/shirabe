name: Check explore scripts

# skills/explore/scripts/explore-state.sh holds the decisions /explore makes
# from the keys of its session explore-<topic>: the resume phase, the ingest of
# a round's lead files and the handoff cleanup. Its suite drives the real koto
# in a store isolated by KOTO_SESSIONS_BASE, and also reads SKILL.md and the
# phase files, so a change to the prose has to run it. It skips the engine
# cases with exit 0 when koto is absent. The Linux leg installs koto and
# asserts it meets the floor before the suite runs, so a skip cannot pass as
# green. The macOS leg runs the suite on the bash 3.2 floor through
# scripts/check-bash-floor.sh; koto is absent there, so the stand-in and prose
# cases run on 3.2 and the engine cases run on Linux.

on:
  pull_request:
    paths:
      - 'skills/explore/scripts/**'
      # explore-state_test.sh reads these to check the prose calls the script.
      - 'skills/explore/SKILL.md'
      - 'skills/explore/references/**'
      # The script reaches the session through skill-session.sh, which opens it
      # from the store template, through koto-open.sh and assert-koto-floor.sh.
      - 'scripts/skill-session.sh'
      - 'koto-templates/skill-session.md'
      - 'scripts/koto-open.sh'
      - 'scripts/assert-koto-floor.sh'
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/explore.list'
      - '.tsuku.toml'
      - '.github/workflows/check-explore-scripts.yml'

env:
  # `tsuku install` calls the GitHub API; the token
  # keeps shared runners from hitting the unauthenticated rate limit.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  test-explore-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Install tsuku (Linux)
        if: runner.os == 'Linux'
        uses: tsukumogami/tsuku/.github/actions/setup-tsuku@d45bd520886554384942a6e017908bdf6b8cf0b9  # installs tsuku 0.15.2

      - name: Install project tools (Linux)
        if: runner.os == 'Linux'
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install -y

      - name: Assert koto meets the floor (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/assert-koto-floor.sh

      - name: Run explore script tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/explore/scripts/explore-state_test.sh

      - name: Run explore script tests on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system explore
