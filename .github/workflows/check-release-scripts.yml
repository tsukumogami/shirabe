name: Check release scripts

# skills/release/scripts/release-state.sh holds the session logic /release runs
# on the keys of release-<topic>: the topic, the range and membership written in
# Phase 1, the version check, the go decision, and the reads in later phases.
# release-grant.sh reads the session's cut-release grant from niwa; its suite
# runs against a stub niwa with no koto. The state suite drives the real koto in a
# store isolated by KOTO_SESSIONS_BASE with a stubbed gh, extracts the Phase 4
# blocks out of SKILL.md at run time, and also reads the prose, so a change to
# SKILL.md has to run it. It skips the engine
# cases with exit 0 when koto is absent. The Linux leg installs koto and
# asserts it meets the floor before the suite runs, so a skip cannot pass as
# green. The macOS leg runs the suite on the bash 3.2 floor through
# scripts/check-bash-floor.sh; koto is absent there, so the stand-in and prose
# cases run on 3.2 and the engine cases run on Linux.

on:
  # The two paths lists below must match; edit both together.
  pull_request:
    paths:
      - 'skills/release/scripts/**'
      # release-state_test.sh reads this to extract the Phase 4 blocks and check
      # the prose calls the script.
      - 'skills/release/SKILL.md'
      # The script reaches the session through skill-session.sh, which opens it
      # from the store template, through koto-open.sh and assert-koto-floor.sh.
      - 'scripts/skill-session.sh'
      - 'koto-templates/skill-session.md'
      - 'scripts/koto-open.sh'
      - 'scripts/assert-koto-floor.sh'
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/release.list'
      - '.tsuku.toml'
      - '.github/workflows/check-release-scripts.yml'
  push:
    branches: [main]
    # Must match the pull_request paths list above. A merge cancels the pull
    # request's macOS leg (cancel-closed-pr-macos-runs.yml), so this is the
    # merge commit's own run on the bash 3.2 floor.
    paths:
      - 'skills/release/scripts/**'
      - 'skills/release/SKILL.md'
      - 'scripts/skill-session.sh'
      - 'koto-templates/skill-session.md'
      - 'scripts/koto-open.sh'
      - 'scripts/assert-koto-floor.sh'
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/release.list'
      - '.tsuku.toml'
      - '.github/workflows/check-release-scripts.yml'

env:
  # `tsuku install` calls the GitHub API; the token
  # keeps shared runners from hitting the unauthenticated rate limit.
  GITHUB_TOKEN: ${{ github.token }}

# A newer push to the same pull request supersedes this run, so it is
# cancelled rather than left holding a macOS runner. The group is this
# workflow plus the pull request; any other event groups on its own commit
# and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-release-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Install tsuku (Linux)
        if: runner.os == 'Linux'
        uses: tsukumogami/tsuku/.github/actions/setup-tsuku@d45bd520886554384942a6e017908bdf6b8cf0b9  # installs tsuku 0.15.2

      - name: Install project tools (Linux)
        if: runner.os == 'Linux'
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install -y

      - name: Assert koto meets the floor (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/assert-koto-floor.sh

      - name: Run release script tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/release/scripts/release-state_test.sh

      - name: Run the grant read tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/release/scripts/release-grant_test.sh

      - name: Run release script tests on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system release
