name: Check koto entry floor

# Every koto-backed skill -- /scope, /execute, /deliver, /work-on and
# /coordinate -- requires
# the koto minimum scripts/assert-koto-floor.sh defines, and that file is its one
# definition. .tsuku.toml tracks the newest koto 0.x rather than pinning a
# release, so every other workflow runs whatever 0.x is newest, and nothing else
# would notice shirabe starting to depend on something the minimum release
# lacks. This job installs exactly the minimum -- the version is read from
# assert-koto-floor.sh -- and runs the templates' compiles, the decider check
# (scripts/check-koto-release.sh), and the skills' koto-backed suites on it.

on:
  pull_request:
    paths:
      - 'skills/scope/**'
      - 'skills/execute/**'
      - 'skills/deliver/**'
      - 'skills/work-on/**'
      - 'skills/coordinate/**'
      # The scope and execute suites call /plan's scripts.
      - 'skills/plan/scripts/**'
      - 'scripts/assert-koto-floor.sh'
      - 'scripts/check-koto-release.sh'
      - 'scripts/koto-open.sh'
      - 'scripts/koto-open_test.sh'
      - 'scripts/plan-mode.sh'
      - 'scripts/skill-preflight.sh'
      - 'scripts/skill-preflight_test.sh'
      - 'scripts/lib/**'
      - 'crates/**'
      - '.tsuku.toml'
      - '.github/workflows/check-koto-entry-floor.yml'

env:
  # `tsuku install` calls the GitHub API; the token
  # keeps shared runners from hitting the unauthenticated rate limit.
  GITHUB_TOKEN: ${{ github.token }}

permissions:
  contents: read

jobs:
  entry-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the floor
        run: |
          set -euo pipefail
          floor=$(bash scripts/assert-koto-floor.sh --print-floor)
          if [ -z "$floor" ]; then
            echo "cannot read the floor from scripts/assert-koto-floor.sh" >&2
            exit 1
          fi
          echo "koto floor: $floor"
          echo "KOTO_FLOOR_RELEASE=$floor" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The scope suites and the preflight entry point call the validator.
      - name: Build and install shirabe
        run: |
          cargo build --release --bin shirabe
          mkdir -p "$HOME/.floor-bin"
          install -m 0755 target/release/shirabe "$HOME/.floor-bin/shirabe"
          echo "$HOME/.floor-bin" >> "$GITHUB_PATH"

      # The suites below skip their engine-backed cases with exit 0 without jq,
      # so it is installed rather than assumed from the runner image.
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Install tsuku
        uses: tsukumogami/tsuku/.github/actions/setup-tsuku@377de20d99e3b219c7c408eeec76311b97990840  # installs tsuku 0.15.0

      # Exactly the floor release, not the newest 0.x .tsuku.toml resolves to.
      - name: Install koto at the floor
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install -y "tsukumogami/koto@$KOTO_FLOOR_RELEASE"

      # The suites below skip with exit 0 without koto, and assert-koto-floor.sh
      # alone would also accept a newer koto; require the floor exactly.
      - name: Assert koto is exactly the floor release
        run: |
          set -euo pipefail
          command -v shirabe
          bash scripts/assert-koto-floor.sh
          got=$(koto version | head -1 | sed -n 's/^koto v\{0,1\}\([0-9][0-9.]*\).*$/\1/p')
          if [ "$got" != "$KOTO_FLOOR_RELEASE" ]; then
            echo "koto on PATH is ${got:-unknown}, expected exactly $KOTO_FLOOR_RELEASE" >&2
            exit 1
          fi

      - name: Compile every shipped template
        run: |
          set -euo pipefail
          for t in skills/scope/koto-templates/scope.md \
                   skills/execute/koto-templates/execute.md \
                   skills/execute/koto-templates/execute-coordinated.md \
                   skills/deliver/koto-templates/deliver.md \
                   skills/work-on/koto-templates/work-on.md \
                   skills/coordinate/koto-templates/coordinate.md; do
            echo "Compiling $t..."
            koto template compile "$t" >/dev/null
          done

      # Decider declarations compile on the minimum, and its decider floor rule
      # refuses an auto answer on a route to a terminal.
      - name: Check the decider declarations on the minimum
        run: bash scripts/check-koto-release.sh

      - name: Run the shared entry and preflight suites
        run: |
          bash scripts/koto-open_test.sh
          bash scripts/skill-preflight_test.sh
          bash scripts/lib/preflight-probe_test.sh

      - name: Run /scope's koto-backed suites
        run: |
          bash skills/scope/scripts/scope-substrate_test.sh
          bash skills/scope/scripts/scope-open_test.sh
          bash skills/scope/scripts/run-intake_test.sh
          bash skills/scope/scripts/scope-template_test.sh
          bash skills/scope/scripts/scope-result_test.sh
          bash skills/scope/scripts/publish-scoping-pr_test.sh

      - name: Run /execute's koto-backed suites
        run: |
          bash skills/execute/scripts/settled-branch-record_test.sh
          bash skills/execute/scripts/execute-template-structure_test.sh
          bash skills/execute/scripts/execute-coordinated-structure_test.sh
          bash skills/execute/scripts/execute-coordinated-engine_test.sh
          bash skills/execute/scripts/execute-open_test.sh
          bash skills/execute/scripts/terminal-retention_test.sh
          bash skills/execute/scripts/drift-facts_test.sh

      - name: Run /deliver's koto-backed suites
        run: |
          bash skills/deliver/scripts/deliver-template-structure_test.sh
          bash skills/deliver/scripts/deliver-open-request_test.sh
          bash skills/deliver/scripts/deliver-absent_test.sh
          bash skills/deliver/scripts/deliver-open_test.sh
          bash skills/deliver/scripts/deliver-engine_test.sh
          bash skills/deliver/scripts/deliver-requires_test.sh

      - name: Run /work-on's koto-backed suites
        run: |
          bash skills/work-on/scripts/terminal-retention_test.sh
          bash skills/work-on/scripts/ci-monitor-role_test.sh
          bash skills/work-on/scripts/retry-clearing_test.sh
          bash skills/work-on/scripts/cascade-chaining_test.sh
          bash skills/work-on/scripts/pre-pr-evidence_test.sh
          bash skills/work-on/scripts/finalization-shape_test.sh
          bash skills/work-on/scripts/check-pre-pr-referents_test.sh
          bash skills/work-on/scripts/record-changed-paths_test.sh
          bash skills/work-on/scripts/check-staleness_test.sh
          bash skills/work-on/scripts/work-on-open_test.sh
          bash skills/work-on/scripts/work-on-requires_test.sh

      - name: Run /coordinate's koto-backed suites
        run: bash skills/coordinate/scripts/run-tests.sh --engine
