name: Check koto-open

# scripts/koto-open.sh is the one koto entry /scope, /execute, and /deliver go
# through. Its suite drives the real koto for the four outcomes and every
# refusal kind, and skips those cases with exit 0 when koto is absent. The
# Linux leg installs koto and asserts it meets the floor before the suite runs, so a
# skip cannot pass as green. The macOS leg runs the suite on the bash 3.2 floor
# through scripts/check-bash-floor.sh; koto is absent there, so the stand-in
# cases run on 3.2 and the engine cases run on Linux.

on:
  # The two paths lists below must match; edit both together.
  pull_request:
    # ready_for_review runs the macOS leg a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/koto-open.sh'
      - 'scripts/koto-open_test.sh'
      # The legacy-environment knob's helper; temporary, #483.
      - 'scripts/lib/koto-legacy-env.sh'
      - 'scripts/lib/koto-legacy-env_test.sh'
      - 'scripts/assert-koto-floor.sh'
      - 'scripts/assert-koto-floor_test.sh'
      # In the koto-open floor suite, so their bash 3.2 runs happen here.
      - 'scripts/koto-minimum-consistency_test.sh'
      - 'scripts/check-koto-release.sh'
      - 'scripts/check-koto-release_test.sh'
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/koto-open.list'
      - '.tsuku.toml'
      - '.github/workflows/check-koto-open.yml'
  push:
    branches: [main]
    # Must match the pull_request paths list above. A merge cancels the pull
    # request's macOS leg (cancel-closed-pr-macos-runs.yml), so this is the
    # merge commit's own run on the bash 3.2 floor.
    paths:
      - 'scripts/koto-open.sh'
      - 'scripts/koto-open_test.sh'
      - 'scripts/lib/koto-legacy-env.sh'
      - 'scripts/lib/koto-legacy-env_test.sh'
      - 'scripts/assert-koto-floor.sh'
      - 'scripts/assert-koto-floor_test.sh'
      - 'scripts/koto-minimum-consistency_test.sh'
      - 'scripts/check-koto-release.sh'
      - 'scripts/check-koto-release_test.sh'
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/koto-open.list'
      - '.tsuku.toml'
      - '.github/workflows/check-koto-open.yml'

env:
  # `tsuku install` calls the GitHub API; the token
  # keeps shared runners from hitting the unauthenticated rate limit.
  GITHUB_TOKEN: ${{ github.token }}

# A newer push to the same pull request supersedes this run, so it is
# cancelled rather than left holding a macOS runner. The group is this
# workflow plus the pull request; any other event groups on its own commit
# and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-koto-open:
    strategy:
      fail-fast: false
      matrix:
        # No macOS leg while the pull request is a draft (shirabe#1300);
        # scripts/check-macos-floor-legs.sh holds the one copy of this line.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Install tsuku (Linux)
        if: runner.os == 'Linux'
        uses: tsukumogami/tsuku/.github/actions/setup-tsuku@d45bd520886554384942a6e017908bdf6b8cf0b9  # installs tsuku 0.15.2

      - name: Install project tools (Linux)
        if: runner.os == 'Linux'
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install -y

      - name: Assert koto meets the floor (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/assert-koto-floor.sh

      - name: Run koto-open tests (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/koto-open_test.sh

      # Temporary, #483: goes with scripts/lib/koto-legacy-env.sh.
      - name: Run the legacy-environment knob helper's tests (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/lib/koto-legacy-env_test.sh

      - name: Run koto floor assertion tests (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/assert-koto-floor_test.sh

      - name: Run the decider check's tests (Linux)
        if: runner.os == 'Linux'
        env:
          # ubuntu-latest ships mikefarah yq v4; a skip here would be a runner
          # image that stopped shipping it, which should fail, not pass.
          CHECK_KOTO_RELEASE_REQUIRE_YQ: "1"
        run: bash scripts/check-koto-release_test.sh

      - name: Run koto-open suite on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system koto-open
