name: Check pipe readers

on:
  pull_request:
    paths:
      - '**/*.sh'
      - '.github/workflows/check-pipe-readers.yml'

jobs:
  check-pipe-readers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A shell value piped into a reader that stops early (`printf "$x" |
      # grep -q`, `echo "$x" | head -1`) is a race under `set -o pipefail`:
      # once the reader exits, the writer's next write fails and a match reads
      # as no match. It failed gates at random until the scripts read values
      # through here-strings; this keeps the shape from coming back.
      #
      # The test harness runs the check against the tree as its first case, so
      # this one step covers both the scan and its own regression suite.
      - name: Check no value is piped into a reader that stops early
        run: bash scripts/check-pipe-readers_test.sh
