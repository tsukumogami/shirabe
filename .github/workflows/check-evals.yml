name: Check skill evals exist

on:
  pull_request:
    paths:
      - 'skills/**'

# Read-only: the check runs from the pull request's own tree, so the token
# gets nothing it could write with (scripts/eval-workflows_test.sh holds this).
permissions:
  contents: read

jobs:
  check-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check all skills have evals
        run: scripts/check-evals-exist.sh
