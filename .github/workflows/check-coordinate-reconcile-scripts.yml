name: Check coordinate reconcile scripts

on:
  # The two paths lists below must match; edit both together.
  pull_request:
    paths:
      - 'skills/coordinate/scripts/reconcile-*'
      # The record's reader, writers and state schema (state-*), which the
      # reader's contract cases and the pass run for real.
      - 'skills/coordinate/scripts/state-*'
      - 'skills/coordinate/scripts/coord-log.sh'
      - 'skills/coordinate/scripts/coord-verdict.sh'
      # reconcile-deps.sh sources /execute's validators.
      - 'skills/execute/scripts/coord-common.sh'
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/coordinate-reconcile.list'
      - '.github/workflows/check-coordinate-reconcile-scripts.yml'
  push:
    branches: [main]
    # Must match the pull_request paths list above. A merge cancels the pull
    # request's macOS leg (cancel-closed-pr-macos-runs.yml), so this is the
    # merge commit's own run on the bash 3.2 floor.
    paths:
      - 'skills/coordinate/scripts/reconcile-*'
      - 'skills/coordinate/scripts/state-*'
      - 'skills/coordinate/scripts/coord-log.sh'
      - 'skills/coordinate/scripts/coord-verdict.sh'
      - 'skills/execute/scripts/coord-common.sh'
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/coordinate-reconcile.list'
      - '.github/workflows/check-coordinate-reconcile-scripts.yml'

# A newer push to the same pull request supersedes this run, so it is
# cancelled rather than left holding a macOS runner. The group is this
# workflow plus the pull request; any other event groups on its own commit
# and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-reconcile-scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq

      # The reconcile scripts need bash, jq and git only; gh, niwa and koto
      # are stand-ins. Linux's own bash 5 runs the suites directly. The macOS
      # leg is the floor check, so it goes through the runner: a bare `bash`
      # on a macOS runner is Homebrew's bash 5, and only /bin/bash is 3.2.
      - name: Run reconcile script tests (Linux)
        if: runner.os == 'Linux'
        run: |
          bash skills/coordinate/scripts/reconcile-report_test.sh
          bash skills/coordinate/scripts/reconcile-check_test.sh
          bash skills/coordinate/scripts/reconcile-read_test.sh
          bash skills/coordinate/scripts/reconcile-pass_test.sh
          bash skills/coordinate/scripts/reconcile-settle_test.sh

      # The runner refuses a /bin/bash that is not 3.2 and keeps a nested
      # `bash` on 3.2 as well.
      - name: Run the reconcile suites on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system coordinate-reconcile

  # Every bash in the floor container is 3.2, including the ones the suites
  # start themselves.
  bash-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the reconcile suites on the bash 3.2 floor
        run: scripts/check-bash-floor.sh --backend docker coordinate-reconcile
