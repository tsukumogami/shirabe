name: Validate Docs

# Example caller (in a downstream repo's .github/workflows/validate-docs.yml):
#
# name: Validate doc formats
# on:
#   pull_request:
#     paths: ['docs/**']
# jobs:
#   validate:
#     uses: tsukumogami/shirabe/.github/workflows/validate-docs.yml@v0.6.0
#     with:
#       custom-statuses: |
#         prd/v1: [Draft, Accepted, In Progress, Done, Delivered]

on:
  workflow_call:
    inputs:
      custom-statuses:
        description: 'YAML map of schema version to custom status values (optional)'
        required: false
        type: string
        default: ''

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check PR context
        # Non-PR triggers (workflow_dispatch, etc.) have no base_ref
        run: |
          if [ -z "${{ github.base_ref }}" ]; then
            echo "::notice::Skipping doc validation: requires a PR context (github.base_ref is empty)"
            exit 0
          fi

      - name: Checkout caller repo
        # Fetch full history so `git diff <base>...<head>` resolves both endpoints.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Checkout shirabe
        # job.workflow_repository and job.workflow_sha resolve to the called
        # workflow's repository and commit SHA. For external callers using
        # `uses: tsukumogami/shirabe/.github/workflows/validate-docs.yml@<ref>`,
        # this picks up tsukumogami/shirabe at the called ref so the binary
        # matches the workflow contract. For the local self-caller
        # (`uses: ./.github/workflows/...`), it resolves to the caller repo at
        # the caller's commit (this PR's head), which is what we want.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shirabe-src

      - name: Install Rust toolchain
        # Reads .shirabe-src/rust-toolchain.toml and installs the pinned channel.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .shirabe-src/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('.shirabe-src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build shirabe
        run: |
          cargo build --release --bin shirabe --manifest-path .shirabe-src/Cargo.toml
          install -m 0755 .shirabe-src/target/release/shirabe /usr/local/bin/shirabe

      - name: Validate changed docs
        # Per-consumer contract (see docs/guides/multi-consumer-cli-contract.md):
        # CI uses the default annotation output mode (no --format), reads the
        # exit code as a zero/non-zero pass-fail gate, and owns path selection
        # -- this workflow computes the changed-file set with git diff and
        # passes the paths positionally. The CLI never discovers files itself.
        env:
          CUSTOM_STATUSES: ${{ inputs.custom-statuses }}
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR \
            ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
            | grep -vE '(^|/)(evals|tests)/fixtures/' || true)

          if [ -z "$FILES" ]; then
            echo "::notice::No doc files changed in this PR"
            exit 0
          fi

          shirabe validate \
            --visibility=${{ github.repository_visibility }} \
            ${CUSTOM_STATUSES:+--custom-statuses="$CUSTOM_STATUSES"} \
            $FILES

      - name: Verify the fold record
        # A /scope absorb deletes a chain document and records the fold in
        # docs/folds.md. This asserts the record kept up.
        #
        # It triggers on a FOLD SIGNATURE, not on deletion. A chain document
        # being deleted is ordinary housekeeping -- superseded roadmaps have
        # been removed from this repository with no fold involved -- and a
        # deletion-triggered check would fail that in every repo pinning this
        # workflow. The signature is a deleted chain document PLUS an
        # absorbed: declaration naming its path added in the same diff. That
        # couples this check to the declaration, which is deliberate: the
        # declaration is what makes a deletion a fold.
        run: |
          set -uo pipefail
          BASE='${{ github.event.pull_request.base.sha }}'
          HEAD='${{ github.event.pull_request.head.sha }}'

          DELETED=$(git diff --name-only --diff-filter=D "$BASE...$HEAD" \
            | grep -E '^docs/(briefs|prds|designs)/(BRIEF|PRD|DESIGN)-[a-z0-9-]+\.md$' || true)

          if [ -z "$DELETED" ]; then
            exit 0
          fi

          # Only the added lines of the diff, so a pre-existing declaration
          # cannot make an unrelated deletion look like a fold.
          ADDED=$(git diff -U0 "$BASE...$HEAD" -- '*.md' | grep '^+' || true)

          status=0
          for doc in $DELETED; do
            case "$ADDED" in
              *"$doc"*) ;;
              *) continue ;;   # deleted, but nothing declared absorbing it
            esac

            if ! git show "$HEAD:docs/folds.md" 2>/dev/null | grep -qF "$doc"; then
              echo "::error::$doc was absorbed but docs/folds.md has no row for it"
              status=1
              continue
            fi

            # The row's blob hash must match the artifact as it was before the
            # fold. Recovering the pre-fold bytes needs full history, which
            # this workflow already fetches.
            want=$(git rev-parse "$BASE:$doc" 2>/dev/null || true)
            row=$(git show "$HEAD:docs/folds.md" | grep -F "$doc" | head -1)
            if [ -n "$want" ] && ! printf '%s' "$row" | grep -qF "$want"; then
              echo "::error::$doc: fold record hash does not match the pre-fold blob ($want)"
              status=1
            fi
          done

          # The record is append-only. Union merge resolves silently, so a
          # rewritten row would merge clean and nobody would see it; the
          # pre-deletion append ordering is what makes this assertion sound.
          if git diff --name-only "$BASE...$HEAD" | grep -qx 'docs/folds.md'; then
            if git diff -U0 "$BASE...$HEAD" -- docs/folds.md \
                 | grep -E '^-[^-]' | grep -q '|'; then
              echo "::error::docs/folds.md rows were removed or rewritten; the record is append-only"
              status=1
            fi
          fi

          exit "$status"
