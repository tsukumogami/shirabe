name: Check skill-session

# scripts/skill-session.sh carries the skill-session convention's shared
# operations: open, status, close, the dispatch key, adopt, close-children,
# ingest, get/put, and the dispatched-by link adopt and open --dispatched-by
# record through scripts/lib/dispatch-link.sh. Its suite drives the real koto
# against the store template, koto-templates/skill-session.md, and skips those
# cases with exit 0 when koto is absent. The Linux leg installs koto and
# asserts it meets the floor before the suite runs, so a skip cannot pass as
# green. The macOS leg runs the suite on the bash 3.2 floor through
# scripts/check-bash-floor.sh; koto is absent there, so the stand-in cases run
# on 3.2 and the engine cases run on Linux.

on:
  # The two paths lists below must match; edit both together.
  pull_request:
    # ready_for_review runs the macOS leg a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/skill-session.sh'
      - 'scripts/skill-session_test.sh'
      - 'koto-templates/skill-session.md'
      # The script opens sessions through koto-open.sh and checks the floor
      # through assert-koto-floor.sh.
      - 'scripts/koto-open.sh'
      - 'scripts/assert-koto-floor.sh'
      # adopt and open --dispatched-by link through it.
      - 'scripts/lib/dispatch-link.sh'
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/skill-session.list'
      - '.tsuku.toml'
      - '.github/workflows/check-skill-session.yml'
  push:
    branches: [main]
    # Must match the pull_request paths list above. A merge cancels the pull
    # request's macOS leg (cancel-closed-pr-macos-runs.yml), so this is the
    # merge commit's own run on the bash 3.2 floor.
    paths:
      - 'scripts/skill-session.sh'
      - 'scripts/skill-session_test.sh'
      - 'koto-templates/skill-session.md'
      - 'scripts/koto-open.sh'
      - 'scripts/assert-koto-floor.sh'
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/skill-session.list'
      - '.tsuku.toml'
      - '.github/workflows/check-skill-session.yml'

env:
  # `tsuku install` calls the GitHub API; the token
  # keeps shared runners from hitting the unauthenticated rate limit.
  GITHUB_TOKEN: ${{ github.token }}

# A newer push to the same pull request supersedes this run, so it is
# cancelled rather than left holding a macOS runner. The group is this
# workflow plus the pull request; any other event groups on its own commit
# and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-skill-session:
    strategy:
      fail-fast: false
      matrix:
        # No macOS leg while the pull request is a draft (shirabe#1300);
        # scripts/check-macos-floor-legs.sh holds the one copy of this line.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Install tsuku (Linux)
        if: runner.os == 'Linux'
        uses: tsukumogami/tsuku/.github/actions/setup-tsuku@d45bd520886554384942a6e017908bdf6b8cf0b9  # installs tsuku 0.15.2

      - name: Install project tools (Linux)
        if: runner.os == 'Linux'
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install -y

      - name: Assert koto meets the floor (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/assert-koto-floor.sh

      - name: Run skill-session tests (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/skill-session_test.sh

      - name: Run skill-session suite on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system skill-session
