name: Check PR workflow content switch

# scripts/pr-workflow-content.sh reads a repository's `## PR Workflow Content:`
# header, the one switch every skill and gate reads to decide whether pull
# request text carries workflow records. Its suite writes throwaway CLAUDE.md
# files and needs only bash, awk, tr and git: the Linux leg runs it under
# bash 5, the macOS leg on the bash 3.2 floor.
#
# It also runs scripts/check-suite-slices.sh, which holds every sliced CI job
# to running all of its slices, on any change to a workflow, and the tests of
# that check and of the selector the sliced runners share
# (scripts/lib/suite-slice.sh). That job is Linux only.

on:
  pull_request:
    # ready_for_review runs the macOS leg a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/pr-workflow-content.sh'
      - 'scripts/pr-workflow-content_test.sh'
      - '.github/workflows/check-pr-workflow-content.yml'
      # The macOS leg reaches bash 3.2 through the runner, so a change to it
      # has to re-run this suite.
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/pr-workflow-content.list'
      # check-suite-slices reads every workflow.
      - '.github/workflows/**'
      - 'scripts/check-suite-slices.sh'
      - 'scripts/check-suite-slices_test.sh'
      - 'scripts/lib/suite-slice.sh'
      - 'scripts/lib/suite-slice_test.sh'

permissions:
  contents: read

# A newer push to the same pull request supersedes this run, so it is
# cancelled rather than left holding a macOS runner. The group is this
# workflow plus the pull request; any other event groups on its own commit
# and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-pr-workflow-content:
    strategy:
      matrix:
        # No macOS leg while the pull request is a draft (shirabe#1300);
        # scripts/check-macos-floor-legs.sh holds the one copy of this line.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run the suite (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/pr-workflow-content_test.sh

      # A bare `bash` on a macOS runner is Homebrew's bash 5; only /bin/bash
      # is 3.2 (shirabe#416), and the runner is the one way onto it.
      - name: Run the suite on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system pr-workflow-content

  # A sliced job runs every suite of its list only when all its slices run:
  # the matrix check pins each sliced job's slice set and fail-fast, and the
  # selector's suite proves any list splits into slices that hold every suite
  # once. yq is pinned as in check-macos-floor-legs.yml.
  check-suite-slices:
    runs-on: ubuntu-latest
    env:
      YQ_VERSION: v4.47.1
      YQ_SHA256: 0fb28c6680193c41b364193d0c0fc4a03177aecde51cfc04d506b1517158c2fb
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned mikefarah yq
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/yq-bin"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $dir/yq" | sha256sum -c -
          chmod +x "$dir/yq"
          out=$("$dir/yq" --version)
          case "$out" in
            *mikefarah/yq*" version ${YQ_VERSION}") ;;
            *) echo "unexpected yq version: $out" >&2; exit 1 ;;
          esac
          echo "$dir" >> "$GITHUB_PATH"

      - name: Run the suite selector's tests
        run: bash scripts/lib/suite-slice_test.sh

      - name: Run check-suite-slices tests
        run: bash scripts/check-suite-slices_test.sh

      - name: Check every sliced job runs all its slices
        run: bash scripts/check-suite-slices.sh
