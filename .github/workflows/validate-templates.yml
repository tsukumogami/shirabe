name: Validate koto templates

on:
  pull_request:
    paths:
      - '**/koto-templates/**'
      # The koto pin decides which compiler checks the templates, so moving it
      # has to recompile them.
      - '.tsuku.toml'
      - 'scripts/assert-koto-pin.sh'
      - '.github/workflows/validate-templates.yml'

jobs:
  validate-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tsuku
        run: |
          curl -fsSL https://get.tsuku.dev/now | bash
          echo "$HOME/.tsuku/bin" >> $GITHUB_PATH
          echo "$HOME/.tsuku/tools/current" >> $GITHUB_PATH

      - name: Install project tools
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install -y

      # The templates are compiled by the koto release .tsuku.toml pins, under
      # which context_assignments are executed and strictly validated. Fail
      # here, not later, if tsuku installed anything else.
      - name: Assert koto is the pinned release
        run: bash scripts/assert-koto-pin.sh

      - name: Validate all koto templates
        run: |
          failed=0
          for template in $(find . -path '*/koto-templates/*.md' -not -name '*.mermaid.md' -type f); do
            echo "Compiling $template..."
            if koto template compile "$template"; then
              echo "  OK"
            else
              echo "  FAILED"
              failed=1
            fi
          done
          exit $failed
