name: Check preflight scripts

on:
  pull_request:
    paths:
      - 'scripts/skill-preflight.sh'
      - 'scripts/skill-preflight_test.sh'
      - 'scripts/lib/preflight-*.sh'
      - 'scripts/lib/tool-routes.tsv'
      - 'scripts/check-skill-requires.sh'
      - 'scripts/check-skill-requires_test.sh'
      - 'skills/*/requires.tsv'
      - 'references/tool-declaration-policy.md'
      # The liveness fixture. Its SKILL.md files carry the injected line the
      # suite extracts and runs, so an edit to the fixture is an edit to what
      # the suite tests -- and a fixture that quietly stopped being
      # unsatisfiable would turn the one assertion covering the injection path
      # into a no-op.
      - 'skills/inflight/evals/fixtures/preflight-liveness/**'
      - '.github/workflows/check-preflight-scripts.yml'
      - '.tsuku.toml'
      - 'scripts/assert-koto-floor.sh'
      # The macOS leg runs the `preflight` suite through the floor runner, and
      # that suite also carries the injection and discard checks' harnesses.
      - 'scripts/check-bash-floor.sh'
      - 'scripts/check-skill-injection.sh'
      - 'scripts/check-skill-injection_test.sh'
      - 'scripts/check-tool-diagnostic-discards.sh'
      - 'scripts/check-tool-diagnostic-discards_test.sh'

env:
  # `tsuku install` calls the GitHub API; the token
  # keeps shared runners from hitting the unauthenticated rate limit.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  test-preflight-scripts:
    strategy:
      # Both legs, always. A single-platform run would let a construct that
      # bash 5 accepts and bash 3.2 rejects reach every macOS user at skill
      # load, which is the one failure this subsystem cannot afford: the
      # injected line's `|| true` swallows the error and the skill loads with
      # no check having run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Provisioning
      #
      # Two suites end by running the real entry point over all twenty-one shipped
      # declarations and asserting zero bytes. That assertion is the contract
      # -- a provisioned host hears nothing -- and it only holds on a host that
      # actually has the declared tools. So this workflow provisions rather
      # than skipping the case: an unprovisioned runner would turn the one
      # end-to-end assertion in the suite into permanent noise.
      #
      # gh, jq, git, and python3 come with both runner images. shirabe is built
      # from this checkout, following .github/workflows/validate-docs.yml, and
      # koto arrives through tsuku from .tsuku.toml, following
      # .github/workflows/validate-templates.yml. Nothing here installs jq: the
      # suites parse no JSON. The declarations are tab-separated, the probe
      # reads --help text, and the reports are prose.
      # ---------------------------------------------------------------------

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build and install shirabe
        run: |
          cargo build --release --bin shirabe
          mkdir -p "$HOME/.preflight-bin"
          install -m 0755 target/release/shirabe "$HOME/.preflight-bin/shirabe"
          echo "$HOME/.preflight-bin" >> "$GITHUB_PATH"

      - name: Install tsuku
        uses: tsukumogami/tsuku/.github/actions/setup-tsuku@377de20d99e3b219c7c408eeec76311b97990840  # installs tsuku 0.15.0

      - name: Install koto
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install -y

      # /scope's and /execute's declarations name the koto init entry flags
      # only koto 0.13.0 and later have, so the zero-bytes assertions hold only
      # from that release on.
      # Run by path rather than through `bash`: this step runs on the macOS leg
      # too, where a bare `bash` reads as a floor leg on Homebrew's bash 5 and
      # scripts/check-macos-floor-legs.sh refuses it. The check is about koto,
      # so which bash interprets it does not matter.
      - name: Assert koto meets the floor
        run: scripts/assert-koto-floor.sh

      # ---------------------------------------------------------------------
      # The suites
      #
      # These scripts must run under the bash each platform actually ships.
      # macOS ships bash 3.2 as /bin/bash and always will, but a bare `bash` on
      # a macOS runner is Homebrew's bash 5 (shirabe#416), which is what an
      # earlier `brew install bash` step in the sibling plan workflow also did.
      # So the macOS leg goes through scripts/check-bash-floor.sh --backend
      # system: it refuses a /bin/bash that is not 3.2, logs the version it ran
      # on, and puts a shim first on PATH so a nested `bash` is 3.2 too.
      # Calling /bin/bash on the harness alone would leave its nested runs of
      # the production line described below -- a bare `bash` on
      # skill-preflight.sh -- on Homebrew's bash 5.
      #
      # This matrix IS the guard against reintroducing a post-3.2 construct;
      # there is deliberately no grep for `declare -A` and friends. A pattern
      # list only catches what its author remembered: the sweep that fixed
      # plan-to-tasks.sh found `declare -A` by grep and missed a bash 4.3
      # nameref entirely, which only surfaced by running the script here.
      # Running the suite on the floor catches constructs nobody enumerated.
      #
      # bash is also the interpreter production uses. The line injected into
      # every skill body is
      # `bash ${CLAUDE_PLUGIN_ROOT}/scripts/skill-preflight.sh <name>`, so both
      # legs test what actually runs at skill load rather than an approximation
      # of it.
      #
      # The two legs together are the cross-version output check: the same
      # tests, with the same recorded expectations, have to pass under bash 3.2
      # and bash 5.
      # ---------------------------------------------------------------------

      - name: Entry point, reader, and resolver (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/skill-preflight_test.sh

      - name: Probe (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/lib/preflight-probe_test.sh

      - name: Reporter and route resolution (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/lib/preflight-report_test.sh

      - name: Declaration conformance (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/check-skill-requires_test.sh

      # The four harnesses above and the scan below, plus the injection and
      # discard checks' harnesses: the `preflight` suite in
      # scripts/check-bash-floor.sh.
      - name: Preflight suite on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system preflight

      # The scan on its own, against the committed tree. The harness runs it as
      # its first case, but a verdict reported only from inside a test harness
      # reads as a test result. This step is the conformance verdict on the
      # branch, and its failure text is the one the author sees.
      # On the macOS leg the scan runs inside the floor suite above.
      - name: Scan the committed declarations (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/check-skill-requires.sh
