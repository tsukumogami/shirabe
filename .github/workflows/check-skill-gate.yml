name: Check skill gate

# The pull request gate. The skill-gate job runs scripts/skill-gate.sh, which
# runs scripts/check-skill.sh on each skill the pull request (or the push to
# main) changes files of: shirabe validate, koto template compile, the skill's
# own script suites, the evals.json shape check and the script cases that
# check its hand-offs. When a shared path changes (scripts/, references/ or
# koto-templates/ at the root) it also runs every skill's script cases,
# scripts/lib/script-cases.py --all. It compares HEAD against the pull
# request's base, or the commit before the push, so it checks out full
# history. Nothing sets SHIRABE_BIN, so check-skill.sh builds the tree's own
# shirabe with cargo on each leg that checks a skill. The Linux leg runs it
# under bash 5, the macOS leg as the skill-gate floor suite on bash 3.2.
#
# test-check-skill runs the suites of check-skill.sh and skill-gate.sh, which
# build throwaway skills and repositories with stand-in shirabe, koto, claude,
# check-skill.sh and script-cases.py, and test-evals-shape runs the shape
# checker's suite. None of the three needs a model or a secret.
#
# Read-only: the jobs run shell from the pull request's own tree, as the
# other script-suite workflows do, so the token gets nothing it could write
# with. scripts/eval-workflows_test.sh fails a change that triggers this on
# pull_request_target, widens its permissions, reads a secret or leaves
# GitHub-hosted runners.

on:
  # The two paths lists below must match; edit both together.
  pull_request:
    # ready_for_review runs the macOS leg a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/check-skill.sh'
      - 'scripts/check-skill_test.sh'
      - 'scripts/lib/check-evals-shape.py'
      - 'scripts/lib/check-evals-shape_test.py'
      # check-skill_test.sh reads the cost rows here (one per coordinate
      # suite), so a change to a skill's map alone has to re-run it.
      - 'skills/*/check-skill.tsv'
      # ... through this script, which holds the comparison.
      - 'scripts/check-cost-rows.sh'
      - '.github/workflows/check-skill-gate.yml'
      # test-evals-shape installs koto from the manifest and checks the floor.
      - '.tsuku.toml'
      - 'scripts/assert-koto-floor.sh'
      # The macOS leg reaches bash 3.2 through the runner, so a change to it
      # has to re-run this suite.
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/check-skill.list'
      # The skill-gate job checks every skill a change touches, and every
      # script case when a shared path changes.
      - 'skills/**'
      - 'scripts/**'
      - 'references/**'
      - 'koto-templates/**'
      - 'scripts/bash-floor/skill-gate.list'
  push:
    branches: [main]
    # Must match the pull_request paths list above. A merge cancels the pull
    # request's macOS leg (cancel-closed-pr-macos-runs.yml), so this is the
    # merge commit's own run on the bash 3.2 floor.
    paths:
      - 'scripts/check-skill.sh'
      - 'scripts/check-skill_test.sh'
      - 'scripts/lib/check-evals-shape.py'
      - 'scripts/lib/check-evals-shape_test.py'
      - 'skills/*/check-skill.tsv'
      - 'scripts/check-cost-rows.sh'
      - '.github/workflows/check-skill-gate.yml'
      - '.tsuku.toml'
      - 'scripts/assert-koto-floor.sh'
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/check-skill.list'
      - 'skills/**'
      - 'scripts/**'
      - 'references/**'
      - 'koto-templates/**'
      - 'scripts/bash-floor/skill-gate.list'

permissions:
  contents: read

# A newer push to the same pull request supersedes this run, so it is
# cancelled rather than left holding a macOS runner. The group is this
# workflow plus the pull request; any other event groups on its own commit
# and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-check-skill:
    strategy:
      matrix:
        # No macOS leg while the pull request is a draft (shirabe#1300);
        # scripts/check-macos-floor-legs.sh holds the one copy of this line.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The real-tree copy's hand-off case runs deliver's case 34, which needs
      # koto with --koto-leg; the suite fails rather than skips without it.
      - name: Install tsuku
        uses: tsukumogami/tsuku/.github/actions/setup-tsuku@d45bd520886554384942a6e017908bdf6b8cf0b9  # installs tsuku 0.15.2

      - name: Install koto
        env:
          TSUKU_TELEMETRY: "0"
          # tsuku install calls the GitHub API; the token keeps shared runners
          # from hitting the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: tsuku install -y

      - name: Assert koto meets the floor
        run: |
          command -v koto
          scripts/assert-koto-floor.sh

      - name: Run the suite (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/check-skill_test.sh

      - name: Run the skill-gate suite (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/skill-gate_test.sh

      # A bare `bash` on a macOS runner is Homebrew's bash 5; only /bin/bash
      # is 3.2 (shirabe#416), and the runner is the one way onto it. The
      # check-skill floor suite holds both suites above.
      - name: Run the suite on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system check-skill

  # The pull request gate: check-skill.sh on each skill with changed files
  # under skills/<name>/, and every script case when a shared path changes.
  # A change under skills/coordinate/ runs all of that skill's suites, which
  # takes tens of minutes; the job sets no time limit of its own.
  skill-gate:
    strategy:
      matrix:
        # No macOS leg while the pull request is a draft (shirabe#1300);
        # scripts/check-macos-floor-legs.sh holds the one copy of this line.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      # The gate diffs HEAD against the base commit, which a shallow checkout
      # doesn't have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # check-skill.sh compiles each skill's templates with koto, and the
      # script cases attach templates with it.
      - name: Install tsuku
        uses: tsukumogami/tsuku/.github/actions/setup-tsuku@d45bd520886554384942a6e017908bdf6b8cf0b9  # installs tsuku 0.15.2

      - name: Install koto
        env:
          TSUKU_TELEMETRY: "0"
          # tsuku install calls the GitHub API; the token keeps shared runners
          # from hitting the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: tsuku install -y

      - name: Assert koto meets the floor
        run: |
          command -v koto
          scripts/assert-koto-floor.sh

      # The gate diffs HEAD against SKILL_GATE_BASE, which this step writes to
      # the job's environment. On a pull request the checkout is the merge
      # commit of the pull request into the base branch's current tip, so the
      # base is that commit's first parent and the diff is the pull request's
      # own change set. The base commit the event records can be older than
      # that tip, and a diff against it would also pick up skills that changed
      # on main since. On a push to main the base is the commit before the
      # push. Neither run step sets SKILL_GATE_BASE, since a step's own env
      # would override this one.
      - name: Pick the base commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$(git rev-parse HEAD^1)
          else
            base=$BEFORE
          fi
          echo "SKILL_GATE_BASE=$base" >> "$GITHUB_ENV"

      - name: Run the gate (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/skill-gate.sh

      - name: Run the gate on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system skill-gate

  # The shape checker's own suite: the tier-2 release-subset rule (every
  # tier-2 scenario names a behaviour, one release scenario per behaviour).
  # The checker reads templates as text and every case runs with koto off
  # PATH, but one case runs the checker again with koto on PATH and compares
  # the verdicts; it fails rather than skips without koto, so the job installs
  # koto and checks it against the floor first.
  test-evals-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tsuku
        uses: tsukumogami/tsuku/.github/actions/setup-tsuku@d45bd520886554384942a6e017908bdf6b8cf0b9  # installs tsuku 0.15.2

      - name: Install koto
        env:
          TSUKU_TELEMETRY: "0"
          # tsuku install calls the GitHub API; the token keeps shared runners
          # from hitting the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: tsuku install -y

      - name: Assert koto meets the floor
        run: |
          command -v koto
          bash scripts/assert-koto-floor.sh

      - name: Run check-evals-shape tests
        run: python3 scripts/lib/check-evals-shape_test.py
