name: Cancel a closed pull request's macOS runs

# When a pull request merges or closes, nothing new is pushed to it, so the
# per-PR cancel-in-progress groups never reach its runs, and its queued macOS
# jobs keep their place in the hosted macOS queue (shirabe#944). This cancels
# the closed PR's unfinished runs of the macOS floor workflows, merged PRs
# included. A merged PR's own macOS result is given up on purpose:
# macos-floor.yml, run on main daily and on the commit a release is cut from,
# is the post-merge macOS check.
#
# The workflows it covers are the ones scripts/check-macos-floor-setup.sh
# --workflows lists, the same parse that gives macos-floor.yml its suites, so
# a new floor workflow is covered without an edit here. The guards (only
# pull_request runs of this PR's branch and commits, never main, never
# macos-floor.yml, never another PR's run, never this run) are in
# scripts/cancel-closed-pr-runs.sh, and its harness pins each one.
#
# pull_request, not pull_request_target: a fork PR's token is read-only, so
# its runs can't be cancelled from here, and the script skips a fork with a
# log line rather than going red. The checkout is the PR's merge ref, whose
# floor workflows are the ones its runs came from.

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    # yq is pinned, as in macos-floor.yml, so the image moving to another yq
    # can't change which workflows the list finds.
    env:
      YQ_VERSION: v4.47.1
      YQ_SHA256: 0fb28c6680193c41b364193d0c0fc4a03177aecde51cfc04d506b1517158c2fb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned mikefarah yq
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/yq-bin"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $dir/yq" | sha256sum -c -
          chmod +x "$dir/yq"
          out=$("$dir/yq" --version)
          case "$out" in
            *mikefarah/yq*" version ${YQ_VERSION}") ;;
            *) echo "unexpected yq version: $out" >&2; exit 1 ;;
          esac
          echo "$dir" >> "$GITHUB_PATH"

      - name: Cancel the PR's unfinished macOS floor runs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/cancel-closed-pr-runs.sh
