name: Check plan scripts

on:
  # The two paths lists below must match; edit both together.
  pull_request:
    # ready_for_review runs the macOS leg a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'skills/plan/scripts/**'
      # resolve-split-mode_test.sh compares the script's header-value constants
      # against the table in this contract, so an edit to either side has to
      # run the suite.
      - 'references/coordination-strategy.md'
      # resolve-plan-version_test.sh validates the step plan example kept here.
      - 'skills/plan/references/quality/plan-doc-examples.md'
      # plan-to-tasks_test.sh runs /execute's hostile-title step plan.
      - 'skills/execute/scripts/testdata/PLAN-v2-hostile.md'
      # plan-to-tasks.sh reads `## Issue Outlines` through `shirabe plan
      # outlines` rather than parsing it, so a change to the crates can break
      # this suite without touching a file under skills/. Leaving the filter
      # narrow would put the drift back one layer up, in CI configuration
      # instead of in code.
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/check-plan-scripts.yml'
      # The macOS leg reaches bash 3.2 through the runner, which reads this
      # suite's scripts from its list, so a change to either has to re-run it.
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/plan.list'
  push:
    branches: [main]
    # Must match the pull_request paths list above. A merge cancels the pull
    # request's macOS leg (cancel-closed-pr-macos-runs.yml), so this is the
    # merge commit's own run on the bash 3.2 floor.
    paths:
      - 'skills/plan/scripts/**'
      - 'references/coordination-strategy.md'
      - 'skills/plan/references/quality/plan-doc-examples.md'
      - 'skills/execute/scripts/testdata/PLAN-v2-hostile.md'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/check-plan-scripts.yml'
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/plan.list'

# A newer push to the same pull request supersedes this run, so it is
# cancelled rather than left holding a macOS runner. The group is this
# workflow plus the pull request; any other event groups on its own commit
# and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-plan-scripts:
    strategy:
      matrix:
        # No macOS leg while the pull request is a draft (shirabe#1300);
        # scripts/check-macos-floor-legs.sh holds the one copy of this line.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      # plan-to-tasks.sh's single-pr path calls `shirabe plan outlines`, and
      # the test harness builds that binary itself (the same way
      # run-cascade_test.sh does). The action reads rust-toolchain.toml so the
      # suite runs against the pinned channel rather than whatever the runner
      # image happens to ship.
      # SHA pin for dtolnay/rust-toolchain@stable, matching build-and-test.yml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # These scripts must run under the bash each platform actually ships.
      # macOS ships bash 3.2 as /bin/bash and always will, but a bare `bash` on
      # a macOS runner is Homebrew's bash 5 (shirabe#416), which is what an
      # earlier `brew install bash` step here also did. So the macOS leg goes
      # through scripts/check-bash-floor.sh --backend system: it refuses a
      # /bin/bash that is not 3.2, logs the version it ran on, and keeps a
      # nested `bash` on 3.2 as well, which calling /bin/bash on the harness
      # alone does not.
      #
      # This matrix IS the guard against reintroducing a post-3.2 construct;
      # there is deliberately no grep for `declare -A` and friends. A pattern
      # list only catches what its author remembered: the sweep that fixed
      # plan-to-tasks.sh found `declare -A` by grep and missed a bash 4.3
      # nameref entirely, which only surfaced by running the script here.
      # Running the suite on the floor catches constructs nobody enumerated.
      #
      # The two legs together are also the cross-version output check: the
      # same tests, with the same recorded expectations, have to pass under
      # bash 3.2 and bash 5.
      - name: Run plan-to-tasks tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/plan/scripts/plan-to-tasks_test.sh

      # resolve-split-mode.sh needs no binary; the same two-leg rule applies.
      - name: Run resolve-split-mode tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/plan/scripts/resolve-split-mode_test.sh

      # resolve-plan-version_test.sh validates the step plan example in
      # references/quality/plan-doc-examples.md with a plan/v2-aware shirabe.
      # It runs the same `cargo build --release -p shirabe` as
      # plan-to-tasks_test.sh, which finds the build already done.
      - name: Run resolve-plan-version tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/plan/scripts/resolve-plan-version_test.sh

      # The harnesses above, on the floor: the `plan` suite in
      # scripts/check-bash-floor.sh.
      - name: Run plan suite on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system plan
