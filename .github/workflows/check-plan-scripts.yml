name: Check plan scripts

on:
  pull_request:
    paths:
      - 'skills/plan/scripts/**'

jobs:
  test-plan-scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      # These scripts must run under the bash each platform actually ships.
      # macOS ships bash 3.2 as /bin/bash and always will, so the macOS leg
      # invokes /bin/bash explicitly rather than `bash`: a newer bash on the
      # runner's PATH would otherwise hide a portability regression, which is
      # exactly what an earlier `brew install bash` step here did.
      #
      # This matrix IS the guard against reintroducing a post-3.2 construct;
      # there is deliberately no grep for `declare -A` and friends. A pattern
      # list only catches what its author remembered: the sweep that fixed
      # plan-to-tasks.sh found `declare -A` by grep and missed a bash 4.3
      # nameref entirely, which only surfaced by running the script here.
      # Running the suite on the floor catches constructs nobody enumerated.
      #
      # The two legs together are also the cross-version output check: the
      # same tests, with the same recorded expectations, have to pass under
      # bash 3.2 and bash 5.
      - name: Run plan-to-tasks tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/plan/scripts/plan-to-tasks_test.sh

      - name: Run validate-plan tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/plan/scripts/validate-plan_test.sh

      - name: Run plan-to-tasks tests (macOS, system bash 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash skills/plan/scripts/plan-to-tasks_test.sh

      - name: Run validate-plan tests (macOS, system bash 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash skills/plan/scripts/validate-plan_test.sh
