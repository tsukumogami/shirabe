name: Check scope scripts

on:
  pull_request:
    paths:
      - 'skills/scope/scripts/**'
      # test-scope-substrate drives real sessions against the shipped template,
      # so a change to the template is a change to what that job asserts. The
      # filter omitted it once and #340 added the branch_check state without the
      # suite ever running: the walk then stopped at the initial state, and the
      # breakage surfaced only on the next PR that happened to touch a script.
      - 'skills/scope/koto-templates/**'
      - 'crates/shirabe-validate/src/formats.rs'
      # hop-complete.sh reimplements the validator's frontmatter splitter, and
      # its notion of a clean run depends on how --check selection drives the
      # outcome. Both rules live in the two files below, so a change to either
      # has to run this suite: the two parsers disagreeing on one input is the
      # defeat, and it has happened twice.
      - 'crates/shirabe-validate/src/frontmatter.rs'
      - 'crates/shirabe/src/main.rs'
      - '.github/workflows/check-scope-scripts.yml'
      # The macOS leg reaches bash 3.2 through the runner, so a change to it has
      # to re-run this suite.
      - 'scripts/check-bash-floor.sh'
      # scope-open.sh enters koto through the shared koto-open.sh, and
      # check-plan-mode.sh re-runs /plan's split-mode resolver.
      - 'scripts/koto-open.sh'
      - 'skills/plan/scripts/resolve-split-mode.sh'
      # The publish and executed-report scripts call /execute's shared
      # ownership filter unchanged, and startable-issues.sh wraps /plan's
      # task-graph parser.
      - 'skills/execute/scripts/owned-pr.sh'
      - 'skills/execute/scripts/run-id.sh'
      - 'skills/plan/scripts/plan-to-tasks.sh'
      # The substrate job runs the newest koto 0.x, checked against the floor.
      - '.tsuku.toml'
      - 'scripts/assert-koto-floor.sh'

env:
  # `tsuku install` calls the GitHub API; the token
  # keeps shared runners from hitting the unauthenticated rate limit.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  test-scope-scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The next three steps run under Linux's own bash 5; the macOS leg runs
      # the same scripts on the bash 3.2 floor in the step after them, through
      # the `scope` suite. A harness added to one of these steps belongs in
      # that suite too; scripts/check-macos-floor-legs.sh fails the job if not.
      #
      # check-citations.sh uses only POSIX-ish bash plus git grep pathspecs, so
      # it runs on macOS's bash 3.2 without the newer-bash install the plan
      # scripts need; the macOS floor step keeps that true.
      - name: Run check-citations tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/scope/scripts/check-citations_test.sh

      # intake's scripts and the /plan hop's consistency check need bash, git
      # and jq only, so they run here and on the macOS floor.
      # run-intake_test.sh and scope-template_test.sh skip their koto cases
      # here; the substrate job below runs them with koto installed.
      - name: Run intake and plan-mode script tests (Linux)
        if: runner.os == 'Linux'
        run: |
          bash skills/scope/scripts/resolve-intent_test.sh
          bash skills/scope/scripts/check-recorded-intent_test.sh
          bash skills/scope/scripts/check-upstream_test.sh
          bash skills/scope/scripts/check-plan-mode_test.sh
          bash skills/scope/scripts/run-intake_test.sh
          bash skills/scope/scripts/scope-template_test.sh

      # Resume routing, the publish step, the exit records, and the printed
      # exit block. A gh stub and a local bare origin stand in for GitHub;
      # the coordinated-body case skips without shirabe, which the substrate
      # job below has.
      - name: Run resume, publish, and exit script tests (Linux)
        if: runner.os == 'Linux'
        run: |
          bash skills/scope/scripts/resume-probe_test.sh
          bash skills/scope/scripts/startable-issues_test.sh
          bash skills/scope/scripts/record-executed-report_test.sh
          bash skills/scope/scripts/record-scope-exit_test.sh
          bash skills/scope/scripts/publish-scoping-pr_test.sh
          bash skills/scope/scripts/print-scope-exit_test.sh

      # The macOS leg is the floor check, so it goes through the runner: a bare
      # `bash` on a macOS runner is Homebrew's bash 5, and only /bin/bash is
      # 3.2 (shirabe#416). The runner refuses a /bin/bash that is not 3.2, logs
      # the version it ran on, and keeps a nested `bash` on 3.2 as well. The
      # scripts it runs are the `scope` suite in scripts/check-bash-floor.sh,
      # the same ones the three steps above run on Linux.
      - name: Run scope script tests on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system scope

      # The document-path shape has one owner and two readers: this script
      # (the gate, the only site that can stop a deletion) and the validator's
      # FC18 (the backstop). Neither substitutes for the other, so the string
      # is shared rather than the behaviour -- and a grep keeps the copies
      # honest, which is
      # strictly more than the contribution-heading table can have, since a
      # table of headings is not a single string.
      - name: Assert the path shape matches its owner in formats.rs
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          owner=$(sed -n 's/.*r"\(\^docs\/(briefs|prds|designs)[^"]*\)".*/\1/p' \
            crates/shirabe-validate/src/formats.rs | head -1)
          if [ -z "$owner" ]; then
            echo "could not read ABSORBED_ENTRY_PATTERN from formats.rs" >&2
            exit 1
          fi
          # The script's copy admits PLAN as well, because the survivor at the
          # terminal hop is one; everything else must match character for
          # character.
          expected="${owner/(briefs|prds|designs)/(briefs|prds|designs|plans)}"
          expected="${expected/(BRIEF|PRD|DESIGN)/(BRIEF|PRD|DESIGN|PLAN)}"
          actual=$(sed -n "s/^readonly DOC_PATH_RE='\(.*\)'$/\1/p" \
            skills/scope/scripts/check-citations.sh)
          if [ "$actual" != "$expected" ]; then
            echo "path shape drifted between formats.rs and check-citations.sh" >&2
            echo "  formats.rs (widened): $expected" >&2
            echo "  check-citations.sh:   $actual" >&2
            exit 1
          fi
          echo "path shape agrees"

  # The hop-completion predicate decides whether a chain hop landed, and it is
  # the only site that can stop a document being deleted as absorbed. Seven
  # defeats have been found in it; each one is a fixture in this suite, so the
  # suite regressing is the defeat returning.
  #
  # It runs on Linux only, and it needs the real binary rather than a stub. That
  # is deliberate, and it is what makes this job a pin as well as a test: the
  # predicate reimplements the validator's frontmatter splitter, so the fixtures
  # ask "do these two parsers still agree" against whatever the validator does
  # today. A stub would pin the copy to itself and agree forever.
  test-hop-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build and install shirabe
        run: |
          cargo build --release --bin shirabe
          mkdir -p "$HOME/.scope-bin"
          install -m 0755 target/release/shirabe "$HOME/.scope-bin/shirabe"
          echo "$HOME/.scope-bin" >> "$GITHUB_PATH"

      # The predicate refuses when the validator is absent, so a missing binary
      # surfaces as 37 refusals rather than a silent pass. Assert it is here
      # anyway, so that failure reads as an environment problem rather than as
      # the predicate having changed its mind.
      - name: Assert the validator is on PATH
        run: command -v shirabe

      - name: Run hop-complete fixtures
        run: bash skills/scope/scripts/hop-complete_test.sh

  # Drives real koto sessions against the shipped template. This is the job that
  # asserts the thing the whole feature is for: a run cannot reach the full-run
  # terminal by claiming it walked the chain. It also asserts the legitimate
  # paths reach it, without which every refusal here would be satisfied by a
  # gate that refuses unconditionally.
  test-scope-substrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build and install shirabe
        run: |
          cargo build --release --bin shirabe
          mkdir -p "$HOME/.scope-bin"
          install -m 0755 target/release/shirabe "$HOME/.scope-bin/shirabe"
          echo "$HOME/.scope-bin" >> "$GITHUB_PATH"

      - name: Install tsuku
        uses: tsukumogami/tsuku/.github/actions/setup-tsuku@49b2d262f54c6c06f3f1936e344c85a9bba4ab57  # installs tsuku 0.14.0

      - name: Install koto
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install -y

      # The suite SKIPS with exit 0 when koto or shirabe is missing, which is
      # right for a developer and wrong for CI: a skip here would report green
      # having asserted nothing. Both binaries are installed above, so assert
      # they are actually present and fail the job if not.
      # assert-koto-floor.sh also fails when koto is older than shirabe's
      # floor, so the sessions never run on a koto shirabe does not support.
      - name: Assert both binaries are present
        run: |
          command -v shirabe
          command -v koto
          bash scripts/assert-koto-floor.sh

      - name: Run scope substrate sessions
        run: bash skills/scope/scripts/scope-substrate_test.sh

      # The entry and intake against the same koto: every argument
      # refusal, the leg records, attach and mismatch, and intake routing each
      # verdict to its terminal. TMPDIR is /tmp here, so PLUGIN_ROOT is a path
      # koto admits and the shipped template runs unmodified.
      - name: Run scope entry and intake sessions
        run: |
          bash skills/scope/scripts/scope-open_test.sh
          bash skills/scope/scripts/run-intake_test.sh
          bash skills/scope/scripts/scope-template_test.sh

      # Every terminal's result through real sessions: the executed report
      # (also through a request leg), the plan-active refusal, republish, the
      # intent_declared split, and a failed publish with its retry.
      - name: Run scope result sessions
        run: |
          bash skills/scope/scripts/scope-result_test.sh
          bash skills/scope/scripts/publish-scoping-pr_test.sh
