name: Check work-on scripts

on:
  pull_request:
    paths:
      - 'skills/work-on/scripts/**'
      # retry-clearing_test.sh extracts the clearing blocks out of the phase
      # files at run time rather than carrying copies, so a phase-file edit can
      # break it while leaving skills/work-on/scripts/** untouched. Without
      # these paths that edit would merge with the suite never having run.
      - 'skills/work-on/references/phases/**'
      # The suite drives the shipped template, so a template edit can change
      # which gate holds which state.
      - 'skills/work-on/koto-templates/**'
      # terminal-retention_test.sh reads the retention rule out of SKILL.md and
      # fails when it is missing or stops routing through the discriminator.
      - 'skills/work-on/SKILL.md'
      # The macOS leg reaches bash 3.2 through the runner, so a change to it has
      # to re-run this suite.
      - 'scripts/check-bash-floor.sh'

jobs:
  test-work-on-scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The suite asserts that a cleared context key holds its phase, which
      # cannot be checked without the engine that evaluates the gate. koto
      # arrives through the project tool manifest, the same way
      # check-execute-scripts.yml and validate-templates.yml get it.
      # terminal-retention_test.sh needs jq to read koto's parentage field and its
      # converge verdicts. Without this the suite skips its engine-backed cases
      # with exit 0, so a runner that stopped shipping jq would go green having
      # tested almost nothing.
      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq

      - name: Install tsuku (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://get.tsuku.dev/now | bash
          echo "$HOME/.tsuku/bin" >> $GITHUB_PATH
          echo "$HOME/.tsuku/tools/current" >> $GITHUB_PATH

      - name: Install project tools (Linux)
        if: runner.os == 'Linux'
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install -y

      # The harness skips with exit 0 when koto is absent, so this step is what
      # keeps a silent skip from hiding a koto that vanished from CI: the install
      # above fails first.
      - name: Run retry-clearing tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/work-on/scripts/retry-clearing_test.sh

      # Drives one koto tick across the cascade states and asserts what that
      # single invocation did. koto chains through a state whose transitions are
      # all unconditional even when it declares required evidence, so a
      # state-by-state review cannot tell whether cascade_run is safe; only a
      # driven tick can. The suite's middle case mutates the shipped template to
      # all-unconditional and asserts the defect is detectable. It skips when
      # koto is absent, which is why it runs here after the install step rather
      # than relying on the skip.
      - name: Run cascade chaining tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/work-on/scripts/cascade-chaining_test.sh

      # Builds real repositories and asserts the post-state verifier reads the
      # finalization COMMIT rather than the working tree. Its central case is a
      # tree where every document is terminal on disk and the commit contains
      # none of them, which is what the cascade's staging defect produces and
      # what a tree-reading check passes. No engine needed, so it runs on both
      # legs.
      - name: Run cascade post-state verifier tests
        run: bash skills/work-on/scripts/verify-cascade-commit_test.sh

      # Drives the shipped ci_monitor block with each session role and asserts
      # where the run lands. Its control is the state as it stood before the
      # branch existed, because the half-changed shape does not compile: koto
      # refuses two edges it cannot prove exclusive. Needs the engine.
      - name: Run ci_monitor role branch tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/work-on/scripts/ci-monitor-role_test.sh

      # terminal-retention_test.sh drives the shipped work-on.md to done_blocked
      # to assert the run's context survives it, and materializes a child to
      # assert that a child carrying the same flag blocks its parent's converge.
      # Both need the engine.
      - name: Run terminal-retention tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/work-on/scripts/terminal-retention_test.sh

      # The macOS leg is the floor check. It goes through the runner rather than
      # calling /bin/bash directly so the whole process tree stays on 3.2, and so
      # it is the same command a developer runs locally.
      - name: Run work-on suite on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system work-on
