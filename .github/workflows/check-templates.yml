name: Check templates

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/*/koto-templates/**'
      # The directives check reads the scripts a gate invokes, so a change to
      # one of those changes what the check sees without touching a template.
      # These two roots cover every file that can: the skill scripts a /scope
      # gate calls, and scripts/ -- which also holds the check, its test and
      # its allowlist, where an edit is an edit to what passes.
      - 'skills/*/scripts/**'
      - 'scripts/**'
      - '.github/workflows/check-templates.yml'

# These jobs run the templates suite under the ubuntu runner's bash, which is
# 5.x. The bash 3.2 floor for the same suite is enforced by
# check-bash-floor.yml, which runs it in a bash:3.2 container; the two together
# are the cross-version check. Run it yourself with
# `scripts/check-bash-floor.sh templates`.

jobs:
  freshness:
    uses: tsukumogami/koto/.github/workflows/check-template-freshness.yml@main
    with:
      template-paths: 'skills/*/koto-templates/*.md'

  # koto compile-checks {{KEY}} references against the template's variables
  # block, but has no equivalent check for shell-style $NAME in a field it
  # hands to sh -c -- that form is passed through and expands to the empty
  # string. Nothing at runtime exercises a template's gate strings in CI, so
  # this grep is the only guard against reintroducing that class.
  interpolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run check-template-interpolation tests
        run: bash scripts/check-template-interpolation_test.sh

      - name: Check koto templates for shell-style interpolation
        run: bash scripts/check-template-interpolation.sh

  # Two authoring shapes koto compiles cleanly and then punishes silently: a
  # non-terminal state whose evidence block has no guarded transition (the
  # engine advances through it without delivering the directive), and, in
  # /scope's template, a hop-completion check decided from the run's own state
  # file or from the run's own evidence rather than from the artifact tree.
  # Neither is visible to `koto template compile`, and neither raises at
  # runtime -- the run does the wrong thing and reports success.
  directives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run check-template-directives tests
        run: bash scripts/check-template-directives_test.sh

      - name: Check koto template directives
        run: bash scripts/check-template-directives.sh

  # work-on.md is the first template here that is both initialized directly by
  # an agent following SKILL.md and materialized as a child from a task array
  # /execute builds. A variable required by the template can therefore be added
  # to one kind of init site and forgotten at the other. koto fails loudly when
  # it happens, but only for whoever runs the path that was missed; this check
  # is what makes the omission visible before the PR lands.
  init-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run check-init-site-vars tests
        run: bash scripts/check-init-site-vars_test.sh

      - name: Check every init site passes the template's required variables
        run: bash scripts/check-init-site-vars.sh

  # A decider declaration is only as good as its modes and its golden
  # fixtures, and koto checks neither: it can't know which mode shirabe meant
  # a value to ship in, or whether the fixture file beside the template meets
  # the minimums koto's promotion report applies. This job holds every
  # declaration to scripts/decider-declarations.tsv and to its fixture file.
  # The check reads files only; it runs no koto and makes no network call, so a
  # pull request from a fork can't spend anyone's decider key.
  #
  # yq is pinned here rather than taken from the runner image, so the image
  # moving to another yq can't change what the check parses. The download is
  # checked against the SHA-256 the release's own checksums file records, and
  # the version the binary reports is checked before anything runs.
  decider-declarations:
    runs-on: ubuntu-latest
    env:
      YQ_VERSION: v4.47.1
      YQ_SHA256: 0fb28c6680193c41b364193d0c0fc4a03177aecde51cfc04d506b1517158c2fb
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned mikefarah yq
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/yq-bin"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $dir/yq" | sha256sum -c -
          chmod +x "$dir/yq"
          out=$("$dir/yq" --version)
          case "$out" in
            *mikefarah/yq*" version ${YQ_VERSION}") ;;
            *) echo "unexpected yq version: $out" >&2; exit 1 ;;
          esac
          echo "$dir" >> "$GITHUB_PATH"

      - name: Run check-decider-declarations tests
        run: bash scripts/check-decider-declarations_test.sh

      - name: Check decider declarations against their modes table and fixtures
        run: bash scripts/check-decider-declarations.sh
