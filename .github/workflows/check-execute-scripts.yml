name: Check execute scripts

on:
  pull_request:
    paths:
      - 'skills/execute/scripts/**'
      # The cascade script and its test moved under /work-on, which /execute
      # reaches over a cross-skill path. This suite still runs them because it
      # carries the Rust toolchain run-cascade_test.sh rebuilds the binary with;
      # the wide `skills/**` filter below is what triggers on them now.
      # terminal-retention_test.sh drives the shipped template and reads the
      # rule out of SKILL.md, so an edit to either can break it while leaving
      # skills/execute/scripts/** untouched.
      - 'skills/execute/koto-templates/**'
      - 'skills/execute/SKILL.md'
      # terminal-retention_test.sh asserts that NO skill names execute.md as its
      # children's template. That premise is broken by an edit to some OTHER
      # skill, and the scan reads every markdown file under skills/ -- this repo
      # puts `koto init` in references/phases too -- so the trigger has to be
      # just as wide as the scan. A narrower one merges the case the scan was
      # widened for without ever running it.
      - 'skills/**'
      # The macOS leg reaches bash 3.2 through the runner, so a change to it
      # has to re-run this suite.
      - 'scripts/check-bash-floor.sh'

jobs:
  test-execute-scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Run cascade tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/work-on/scripts/run-cascade_test.sh

      - name: Run assert-child-template tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/assert-child-template_test.sh

      # The merge scripts' tests drive a test-local gh stub, so they need
      # neither koto nor network access and run before the toolchain installs.
      - name: Run merge-verdict tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/merge-verdict_test.sh

      - name: Run merge-exec tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/merge-exec_test.sh

      # settled-branch-record_test.sh drives real koto sessions -- it asserts
      # that orchestrator_setup's gate holds the state when the settled branch
      # was not recorded, which cannot be checked without the engine that
      # evaluates the gate. koto arrives through the project tool manifest, the
      # same way validate-templates.yml gets it.
      - name: Install tsuku (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://get.tsuku.dev/now | bash
          echo "$HOME/.tsuku/bin" >> $GITHUB_PATH
          echo "$HOME/.tsuku/tools/current" >> $GITHUB_PATH

      - name: Install project tools (Linux)
        if: runner.os == 'Linux'
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install -y

      - name: Run settled-branch-record tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/settled-branch-record_test.sh

      # terminal-retention_test.sh drives the shipped execute.md to its real
      # terminals to assert the session's context survives them, which needs the
      # same engine. It also checks the premise behind /execute passing
      # --no-cleanup unconditionally: that nothing materializes execute.md as a
      # koto child.
      - name: Run terminal-retention tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/terminal-retention_test.sh

      # drift-facts_test.sh runs drift-facts.sh against git fixtures with a
      # bare origin, then drives the shipped execute.md through drift_facts and
      # worktree_sync to spawn_and_await or worktree_discipline_check, which
      # needs the same engine for its second half.
      - name: Run drift-facts tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/drift-facts_test.sh

      # The macOS leg is the floor check, and until now it was not one: it
      # invoked `bash`, which resolves to whatever the runner image has on
      # PATH, so a post-3.2 construct would have passed here unnoticed. That is
      # the shape check-plan-scripts.yml calls out.
      #
      # Going through the runner rather than calling /bin/bash directly is what
      # closes the second half of the hole. run-cascade_test.sh re-enters with
      # a bare `bash "$CASCADE_SCRIPT"`, so /bin/bash alone would put the
      # harness on the floor and leave run-cascade.sh itself - the 900 lines
      # that actually ship - running under whatever bash PATH resolves to. The
      # runner puts a 3.2 shim ahead of PATH so the whole process tree stays on
      # the floor. It is also the same command a developer runs locally.
      - name: Run execute suite on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system execute
