name: Check execute scripts

on:
  pull_request:
    paths:
      - 'skills/execute/scripts/**'
      # The cascade script and its test moved under /work-on, which /execute
      # reaches over a cross-skill path. This suite still runs them because it
      # carries the Rust toolchain run-cascade_test.sh rebuilds the binary with;
      # the wide `skills/**` filter below is what triggers on them now.
      # terminal-retention_test.sh drives the shipped template and reads the
      # rule out of SKILL.md, so an edit to either can break it while leaving
      # skills/execute/scripts/** untouched.
      - 'skills/execute/koto-templates/**'
      - 'skills/execute/SKILL.md'
      # terminal-retention_test.sh asserts that NO skill names execute.md as its
      # children's template. That premise is broken by an edit to some OTHER
      # skill, and the scan reads every markdown file under skills/ -- this repo
      # puts `koto init` in references/phases too -- so the trigger has to be
      # just as wide as the scan. A narrower one merges the case the scan was
      # widened for without ever running it.
      - 'skills/**'
      # The macOS leg reaches bash 3.2 through the runner, so a change to it
      # has to re-run this suite.
      - 'scripts/check-bash-floor.sh'
      # The engine-backed suites run the koto release .tsuku.toml pins.
      - '.tsuku.toml'
      - 'scripts/assert-koto-pin.sh'

jobs:
  test-execute-scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Run cascade tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/work-on/scripts/run-cascade_test.sh

      - name: Run assert-child-template tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/assert-child-template_test.sh

      # The merge scripts' tests drive a test-local gh stub, so they need
      # neither koto nor network access and run before the toolchain installs.
      - name: Run merge-verdict tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/merge-verdict_test.sh

      - name: Run merge-exec tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/merge-exec_test.sh

      # The single-pr merge step's scripts. Each drives test-local gh and koto
      # stubs (and real git where it pushes), so none needs the engine.
      - name: Run owned-pr tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/owned-pr_test.sh

      - name: Run push-and-record tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/push-and-record_test.sh

      - name: Run record-merge-verdict tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/record-merge-verdict_test.sh

      - name: Run adopt-or-create-pr and write-set tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/adopt-or-create-pr_test.sh

      - name: Run print-exit tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/print-exit_test.sh

      # The eval gh shim, and the verdict each merge-step eval fixture makes
      # the real scripts reach.
      - name: Run eval gh shim tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/eval-gh-shim_test.sh

      # The coordinated loop's scripts: the next action, the verdict and its
      # record, the setup record, node branches, node pushes and their head=
      # records, and the merge. Each drives the eval gh shim's repository
      # model, a koto context stub, and real git, so none needs the engine.
      - name: Run coordinated loop script tests (Linux)
        if: runner.os == 'Linux'
        run: |
          bash skills/execute/scripts/coordinated-next_test.sh
          bash skills/execute/scripts/coordination-verdict_test.sh
          bash skills/execute/scripts/record-coordination-verdict_test.sh
          bash skills/execute/scripts/record-coord-setup_test.sh
          bash skills/execute/scripts/node-cut_test.sh
          bash skills/execute/scripts/node-push_test.sh
          bash skills/execute/scripts/coord-merge_test.sh

      # settled-branch-record_test.sh drives real koto sessions -- it asserts
      # that orchestrator_setup's gate holds the state when the settled branch
      # was not recorded, which cannot be checked without the engine that
      # evaluates the gate. koto arrives through the project tool manifest, the
      # same way validate-templates.yml gets it.
      - name: Install tsuku (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://get.tsuku.dev/now | bash
          echo "$HOME/.tsuku/bin" >> $GITHUB_PATH
          echo "$HOME/.tsuku/tools/current" >> $GITHUB_PATH

      - name: Install project tools (Linux)
        if: runner.os == 'Linux'
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install -y

      # The engine-backed suites below skip with exit 0 when koto is absent.
      # This fails the job instead, and also when koto is not the release
      # .tsuku.toml pins.
      - name: Assert koto is the pinned release (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/assert-koto-pin.sh

      - name: Run settled-branch-record tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/settled-branch-record_test.sh

      # The merge step's structural guarantees, read from the compiled
      # execute.md: merge_attempt's non-overridable MERGE gate and no default
      # action, non-overridable context-matches gates on merge_route and
      # merge_confirm, no edge into `done`, merge_confirm as the only way into
      # `merged`, no assignment writing home_pr, and the DIRTY route.
      - name: Run execute template structure tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/execute-template-structure_test.sh

      # The coordinated envelope's shape, read from the compiled
      # execute-coordinated.md: every edge into `merged` from
      # coord_merge_confirm alone, non-overridable context-matches gates on
      # coord_verdict and coord_merge_confirm and no command gate there, no
      # reason assigned out of coord_verdict and only its absent-or-unmatched
      # edge assigning a step, and no done_refused state.
      - name: Run coordinated envelope structure tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/execute-coordinated-structure_test.sh

      # The same envelope on the engine: each terminal reached with
      # --no-cleanup and its result keys, the override refusals, and the
      # promoted leg result under --koto-leg.
      - name: Run coordinated envelope engine tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/execute-coordinated-engine_test.sh

      # /execute's koto entry: the flags reach koto as variables, and koto's
      # refusals (duplicate or invalid --merge, another template's live
      # session, a stale --koto-leg) leave the session and its MERGE unchanged.
      - name: Run execute-open tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/execute-open_test.sh

      # terminal-retention_test.sh drives the shipped execute.md to its real
      # terminals to assert the session's context survives them, which needs the
      # same engine. It also checks the premise behind /execute passing
      # --no-cleanup unconditionally: that nothing materializes execute.md as a
      # koto child.
      - name: Run terminal-retention tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/terminal-retention_test.sh

      # drift-facts_test.sh runs drift-facts.sh against git fixtures with a
      # bare origin, then drives the shipped execute.md through drift_facts and
      # worktree_sync to spawn_and_await or worktree_discipline_check, which
      # needs the same engine for its second half.
      - name: Run drift-facts tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/execute/scripts/drift-facts_test.sh

      # The macOS leg is the floor check, and until now it was not one: it
      # invoked `bash`, which resolves to whatever the runner image has on
      # PATH, so a post-3.2 construct would have passed here unnoticed. That is
      # the shape check-plan-scripts.yml calls out.
      #
      # Going through the runner rather than calling /bin/bash directly is what
      # closes the second half of the hole. run-cascade_test.sh re-enters with
      # a bare `bash "$CASCADE_SCRIPT"`, so /bin/bash alone would put the
      # harness on the floor and leave run-cascade.sh itself - the 900 lines
      # that actually ship - running under whatever bash PATH resolves to. The
      # runner puts a 3.2 shim ahead of PATH so the whole process tree stays on
      # the floor. It is also the same command a developer runs locally.
      - name: Run execute suite on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system execute
