# Manual-only: this workflow runs when someone dispatches it, never on a
# schedule or a push.
#
# scripts/run-evals.sh runs a skill's script-graded cases only and lists every
# graded case as refused (Decision 1 of
# docs/designs/current/DESIGN-skill-regression-detection.md). So a dispatch needs no
# model, no API key and no repository secret: the job installs koto, which the
# hand-off cases compile templates with, checks it against the floor, and runs
# the harness. The koto install passes github.token to tsuku only so that its
# GitHub API calls aren't rate limited.
#
# The skill input reaches the shell through the environment, never through
# template expansion inside a run block, and the step refuses any value that
# isn't empty or a skill name before the harness starts.
name: Run skill evals

on:
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill name to run the script cases of (leave empty for all)'
        required: false
        default: ''
      ref:
        description: 'Branch or ref to run on'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  run-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tsuku
        uses: tsukumogami/tsuku/.github/actions/setup-tsuku@d45bd520886554384942a6e017908bdf6b8cf0b9  # installs tsuku 0.15.2

      - name: Install koto
        env:
          TSUKU_TELEMETRY: "0"
          # tsuku install calls the GitHub API; the token keeps shared runners
          # from hitting the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: tsuku install -y

      - name: Assert koto meets the floor
        run: |
          command -v koto
          bash scripts/assert-koto-floor.sh

      - name: Run evals
        env:
          SKILL: ${{ github.event.inputs.skill }}
        run: |
          if [ -n "$SKILL" ]; then
            case "$SKILL" in
              [!abcdefghijklmnopqrstuvwxyz0123456789]* | *[!abcdefghijklmnopqrstuvwxyz0123456789-]*)
                printf '%s\n' "Error: the skill input must be empty or a skill name matching [a-z0-9][a-z0-9-]*, got '$SKILL'" >&2
                exit 1
                ;;
            esac
            scripts/run-evals.sh "$SKILL"
          else
            scripts/run-evals.sh --all
          fi
