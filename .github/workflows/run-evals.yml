# Manual-only: this workflow runs when someone dispatches it, never on a
# schedule. The model-graded eval signal moved to the release check (see the
# evals-at-release design and .claude/shirabe-extensions/release.md); this
# workflow stays so whoever fixes shirabe#612 can dispatch a run and show
# scenarios being graded.
#
# A run needs three things:
# - The isolated-checkout fix tracked in shirabe#612. Until it lands, the
#   harness cannot grade scenarios here: scripts/run-evals.sh fails to set
#   up its isolated checkout on a branch, and a run on main grades nothing.
# - The ANTHROPIC_API_KEY repository secret, which the claude CLI steps read.
# - The skill-creator plugin, which the job installs from the official
#   plugin marketplace before running scripts/run-evals.sh.
name: Run skill evals

on:
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill name to eval (leave empty for all)'
        required: false
        default: ''
      ref:
        description: 'Branch or ref to run evals on'
        required: false
        default: 'main'

jobs:
  run-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Add official plugin marketplace
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: claude plugin marketplace add anthropics/claude-plugins-official

      - name: Install skill-creator plugin
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: claude plugin install skill-creator --scope user

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.skill }}" ]; then
            scripts/run-evals.sh "${{ github.event.inputs.skill }}"
          else
            scripts/run-evals.sh --all
          fi
