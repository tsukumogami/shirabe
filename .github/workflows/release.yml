name: Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Semver without v prefix (e.g., 0.3.0)'
        required: true
        type: string
      tag:
        description: 'Git tag with v prefix (e.g., v0.3.0)'
        required: true
        type: string
      ref:
        description: 'Branch to release from'
        required: true
        type: string
      dry-run:
        description: 'Skip push and tag creation'
        required: false
        type: boolean
        default: false
      dev-suffix:
        description: 'Suffix for dev version (e.g., -dev, -SNAPSHOT)'
        required: false
        type: string
        default: '-dev'
    secrets:
      token:
        description: 'Push token (falls back to GITHUB_TOKEN)'
        required: false
    outputs:
      tag:
        description: 'The created tag name'
        value: ${{ jobs.release.outputs.tag }}
      release-url:
        description: 'URL of the draft release'
        value: ${{ jobs.release.outputs.release-url }}

  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without v prefix (e.g., 0.3.0)'
        required: true
        type: string
      tag:
        description: 'Git tag with v prefix (e.g., v0.3.0)'
        required: true
        type: string
      ref:
        description: 'Branch to release from'
        required: true
        type: string
        default: main
      dry-run:
        description: 'Skip push and tag creation'
        required: false
        type: boolean
        default: false
      dev-suffix:
        description: 'Suffix for dev version'
        required: false
        type: string
        default: '-dev'

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag || steps.tag-dry-run.outputs.tag }}
      release-url: ${{ steps.tag.outputs.release-url || steps.tag-dry-run.outputs.release-url }}
    # Caller-supplied inputs reach the scripts below only through env and are
    # referenced as quoted shell variables, never expanded into the script
    # text. The first step checks their format before anything uses them.
    steps:
      - name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          # [[ =~ ]] matches the whole string, so a value with an embedded
          # newline can't pass on the strength of one valid line.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $(printf '%q' "$TAG") does not match v<major>.<minor>.<patch>"
            exit 1
          fi
          # VERSION feeds shell arithmetic when the next dev version is computed.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $(printf '%q' "$VERSION") does not match <major>.<minor>.<patch>"
            exit 1
          fi

      - name: Determine effective token
        id: token
        run: |
          if [ -n "${{ secrets.token }}" ]; then
            echo "token=${{ secrets.token }}" >> "$GITHUB_OUTPUT"
          else
            echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate token permissions
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # Verify the token can push by checking repo permissions
          PERMISSION=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push // false')
          if [ "$PERMISSION" != "true" ]; then
            echo "::error::Token does not have push permission on $GITHUB_REPOSITORY"
            echo "If this repo has branch protection, pass a PAT via the token secret."
            exit 1
          fi

      - name: Validate no existing tag
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "::error::Tag $TAG already exists on remote"
            echo "Delete it first: git push --delete origin $TAG"
            exit 1
          fi

      - name: Validate draft release exists
        id: draft
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # gh release view can't find drafts by tag when the git tag doesn't
          # exist yet. Use gh release list with a jq filter instead; the tag
          # goes to jq as an argument, not as part of the filter text.
          DRAFT_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isDraft 2>/dev/null \
            | jq -r --arg tag "$TAG" '.[] | select(.tagName == $tag and .isDraft) | .tagName' \
            || echo "")

          if [ -z "$DRAFT_TAG" ]; then
            # Check if a non-draft release exists (already published)
            PUBLISHED=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isDraft 2>/dev/null \
              | jq -r --arg tag "$TAG" '.[] | select(.tagName == $tag and (.isDraft | not)) | .tagName' \
              || echo "")
            if [ -n "$PUBLISHED" ]; then
              echo "::error::Release $TAG exists and is already published"
              exit 1
            fi
            echo "::warning::No draft release found for $TAG. Tag annotation will use a default message."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Draft release found for $TAG"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stamp release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -x .release/set-version.sh ]; then
            echo "Running .release/set-version.sh $VERSION"
            .release/set-version.sh "$VERSION"
          else
            echo "No .release/set-version.sh found, skipping version stamp"
          fi

      - name: Commit release version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if git diff --quiet; then
            echo "No version file changes to commit"
          else
            git add -A
            git commit -m "chore(release): set version to $TAG"
          fi

      - name: Create annotated tag
        if: ${{ inputs.dry-run == false }}
        id: tag
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ inputs.tag }}
          DRAFT_FOUND: ${{ steps.draft.outputs.found }}
        run: |
          # pipefail keeps a failed gh call failing the step, as it did
          # before the output was piped through jq.
          set -o pipefail
          if [ "$DRAFT_FOUND" = "true" ]; then
            # Extract release notes from the draft release via API
            gh api "repos/$GITHUB_REPOSITORY/releases" \
              | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag and .draft) | .body' \
              > /tmp/release-notes.md
          fi

          if [ -s /tmp/release-notes.md ]; then
            git tag -a "$TAG" --cleanup=verbatim -F /tmp/release-notes.md
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          RELEASE_URL=$(gh api "repos/$GITHUB_REPOSITORY/releases" 2>/dev/null \
            | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .html_url' \
            || echo "")
          echo "release-url=${RELEASE_URL:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag (dry-run)
        if: ${{ inputs.dry-run == true }}
        id: tag-dry-run
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "DRY-RUN: Would create tag $TAG at $(git rev-parse HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release-url=dry-run" >> "$GITHUB_OUTPUT"

      - name: Compute next dev version
        id: next-dev
        env:
          VERSION: ${{ inputs.version }}
          SUFFIX: ${{ inputs.dev-suffix }}
        run: |
          # Checked again here, not only in Validate inputs: bash evaluates a
          # variable used in $(( )) as an expression, including any command
          # substitution in an array subscript, so passing VERSION through env
          # isn't enough on its own for this step.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $(printf '%q' "$VERSION") does not match <major>.<minor>.<patch>"
            exit 1
          fi
          # Bump patch: 0.3.0 -> 0.3.1
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          NEXT_DEV="${MAJOR}.${MINOR}.${NEXT_PATCH}${SUFFIX}"
          echo "version=$NEXT_DEV" >> "$GITHUB_OUTPUT"
          echo "Next dev version: $NEXT_DEV"

      - name: Stamp dev version
        env:
          NEXT_DEV: ${{ steps.next-dev.outputs.version }}
        run: |
          if [ -x .release/set-version.sh ]; then
            echo "Running .release/set-version.sh $NEXT_DEV"
            .release/set-version.sh "$NEXT_DEV"
          else
            echo "No .release/set-version.sh found, skipping dev version stamp"
          fi

      - name: Commit dev version
        env:
          NEXT_DEV: ${{ steps.next-dev.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "No dev version changes to commit"
          else
            git add -A
            git commit -m "chore(release): advance to $NEXT_DEV"
          fi

      - name: Push branch
        if: ${{ inputs.dry-run == false }}
        env:
          REF: ${{ inputs.ref }}
        run: |
          echo "Pushing branch $REF..."
          if ! git push origin "HEAD:$REF"; then
            echo "::error::Push to $REF failed"
            echo "If another commit landed, try: git pull --rebase origin $REF && git push"
            exit 1
          fi

      - name: Push tag
        if: ${{ inputs.dry-run == false }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "Pushing tag $TAG..."
          if ! git push origin "$TAG"; then
            echo "::error::Tag push failed for $TAG"
            echo "Check if tag protection rules allow this token to create tags"
            exit 1
          fi

      - name: Dry-run summary
        if: ${{ inputs.dry-run == true }}
        env:
          REF: ${{ inputs.ref }}
          TAG: ${{ inputs.tag }}
          NEXT_DEV: ${{ steps.next-dev.outputs.version }}
        run: |
          echo "=== DRY-RUN SUMMARY ==="
          echo "Would push branch $REF with these commits:"
          git log --oneline "origin/$REF..HEAD"
          echo ""
          echo "Would create tag $TAG at:"
          git log --oneline -1 HEAD~1
          echo ""
          echo "Dev version on main after release: $NEXT_DEV"
