name: Check Jev criteria

# Every Jev criterion's entry in references/rule-registry.json carries a slice
# contract and, once trusted, a promotion record. scripts/jev-criteria/
# jev_criteria.py holds those records to the templates, the fixture files and
# the slice scripts, and with --base to the registry as the pull request found
# it, so a contract or a false pass can't be dropped quietly. It also holds the
# document criteria's templates to their pins in references/doc-criteria.json
# and refuses a veto on those criteria or an auto decider value anywhere. Nothing here
# calls Jev or the network, and the job reads files only, so a pull request
# from a fork can't spend anyone's decider key.

on:
  # The two paths lists below must match; edit both together.
  pull_request:
    # ready_for_review runs the macOS leg a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/jev-criteria/**'
      - 'references/rule-registry.json'
      - 'references/jev-criteria.md'
      - 'docs/guides/jev-criteria.md'
      - 'scripts/rule-registry.sh'
      - 'scripts/rule-registry_test.sh'
      - 'scripts/review-shadow/**'
      - 'scripts/jev-withhold.sh'
      - 'scripts/jev-withhold_test.sh'
      - 'scripts/bash-floor/jev-withhold.list'
      - 'skills/*/koto-templates/**'
      - 'koto-templates/**'
      - 'scripts/doc-criteria/**'
      - 'references/doc-criteria.json'
      - 'skills/work-on/scripts/review-level.sh'
      - 'skills/work-on/references/review-level-rules.tsv'
      - '.github/workflows/check-jev-criteria.yml'
  push:
    branches: [main]
    # Must match the pull_request paths list above. A merge cancels the pull
    # request's macOS leg (cancel-closed-pr-macos-runs.yml), so this is the
    # merge commit's own run on the bash 3.2 floor.
    paths:
      - 'scripts/jev-criteria/**'
      - 'references/rule-registry.json'
      - 'references/jev-criteria.md'
      - 'docs/guides/jev-criteria.md'
      - 'scripts/rule-registry.sh'
      - 'scripts/rule-registry_test.sh'
      - 'scripts/review-shadow/**'
      - 'scripts/jev-withhold.sh'
      - 'scripts/jev-withhold_test.sh'
      - 'scripts/bash-floor/jev-withhold.list'
      - 'skills/*/koto-templates/**'
      - 'koto-templates/**'
      - 'scripts/doc-criteria/**'
      - 'references/doc-criteria.json'
      - 'skills/work-on/scripts/review-level.sh'
      - 'skills/work-on/references/review-level-rules.tsv'
      - '.github/workflows/check-jev-criteria.yml'

permissions:
  contents: read

# A newer push to the same pull request supersedes this run, so it is
# cancelled rather than left holding a macOS runner. The group is this
# workflow plus the pull request; any other event groups on its own commit
# and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # yq is pinned rather than taken from the runner image, as in
    # check-templates.yml: the download is checked against the SHA-256 the
    # release records, and the version is checked before anything runs.
    env:
      YQ_VERSION: v4.47.1
      YQ_SHA256: 0fb28c6680193c41b364193d0c0fc4a03177aecde51cfc04d506b1517158c2fb
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned mikefarah yq
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/yq-bin"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $dir/yq" | sha256sum -c -
          chmod +x "$dir/yq"
          out=$("$dir/yq" --version)
          case "$out" in
            *mikefarah/yq*" version ${YQ_VERSION}") ;;
            *) echo "unexpected yq version: $out" >&2; exit 1 ;;
          esac
          echo "$dir" >> "$GITHUB_PATH"

      - name: Run the jev-criteria tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          python3 scripts/jev-criteria/test_jev_criteria.py -v

      - name: Run the document criteria's slice script tests
        run: python3 scripts/doc-criteria/test_slice.py -v

      # Against the merge base, as check-rule-registry.yml does: the history
      # rules compare a changed declaration's date with the base's, and the
      # base branch's tip can be newer than the point this branch left it. A
      # push to main has no pull request, so its base is main as it was
      # before the push (github.event.before).
      - name: Check every Jev criterion against its contract and the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base=$(git merge-base "$BASE_SHA" HEAD)
          python3 scripts/jev-criteria/jev_criteria.py check --base "$base"

  # The withholding script decides what a run loads, so its suite runs on
  # Linux's bash 5 and on the bash 3.2 floor macOS ships. The suite uses a
  # stub koto and a scratch plugin root; no real koto or key is involved.
  withhold:
    strategy:
      matrix:
        # No macOS leg while the pull request is a draft (shirabe#1300);
        # scripts/check-macos-floor-legs.sh holds the one copy of this line.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run the withhold suite (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/jev-withhold_test.sh

      # A bare `bash` on a macOS runner is Homebrew's bash 5; only /bin/bash
      # is 3.2, and check-bash-floor.sh is the one way onto it.
      - name: Run the withhold suite on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system jev-withhold
