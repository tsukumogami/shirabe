name: Check review packet

# scripts/review-packet.sh assembles the input packet every review seat starts
# from (references/review-seat-commissioning.md). Its suite builds a throwaway
# repository with stand-in koto and gh, so it needs only bash, git and jq (the
# recheck kind reads the panel scope with jq; both runner images ship it): the
# Linux leg runs it under bash 5, the macOS leg on the bash 3.2 floor.

on:
  # The two paths lists below must match; edit both together.
  pull_request:
    # ready_for_review runs the macOS leg a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/review-packet.sh'
      - 'scripts/review-packet_test.sh'
      # A relative --format resolves against the plugin root, and the suite
      # reads a shipped format reference to prove it.
      - 'skills/brief/references/brief-format.md'
      # The spawn-site cases read every review spawn site.
      - 'skills/*/references/phases/*.md'
      - 'skills/review-plan/SKILL.md'
      - '.github/workflows/check-review-packet.yml'
      # The macOS leg reaches bash 3.2 through the runner, so a change to it
      # has to re-run this suite.
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/review-packet.list'
  push:
    branches: [main]
    # Must match the pull_request paths list above. A merge cancels the pull
    # request's macOS leg (cancel-closed-pr-macos-runs.yml), so this is the
    # merge commit's own run on the bash 3.2 floor.
    paths:
      - 'scripts/review-packet.sh'
      - 'scripts/review-packet_test.sh'
      - 'skills/brief/references/brief-format.md'
      - 'skills/*/references/phases/*.md'
      - 'skills/review-plan/SKILL.md'
      - '.github/workflows/check-review-packet.yml'
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/review-packet.list'

permissions:
  contents: read

# A newer push to the same pull request supersedes this run, so it is
# cancelled rather than left holding a macOS runner. The group is this
# workflow plus the pull request; any other event groups on its own commit
# and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-review-packet:
    strategy:
      matrix:
        # No macOS leg while the pull request is a draft (shirabe#1300);
        # scripts/check-macos-floor-legs.sh holds the one copy of this line.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run the suite (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/review-packet_test.sh

      # A bare `bash` on a macOS runner is Homebrew's bash 5; only /bin/bash
      # is 3.2 (shirabe#416), and the runner is the one way onto it.
      - name: Run the suite on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system review-packet
