name: Check coordinate scripts

# This workflow runs on a pull request and again on the push its merge makes
# to main. A merge leaves the pull request's own run behind: its macOS leg, the
# coordinate suite on the bash 3.2 floor, may still be queued or running, and
# cancel-closed-pr-macos-runs.yml cancels it once the pull request closes,
# giving that result up on purpose, with macos-floor.yml checking main once a
# day. The push run is the merge commit's own run on both platforms, so a
# change to these paths is checked on the floor as it lands rather than at
# the next daily run (shirabe#1077).

on:
  # The two paths lists below must match; edit both together.
  pull_request:
    # ready_for_review runs the macOS leg a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'skills/coordinate/**'
      - 'scripts/koto-open.sh'
      - 'scripts/skill-preflight.sh'
      - 'scripts/lib/**'
      - 'skills/execute/scripts/merge-exec.sh'
      - 'skills/execute/scripts/merge-verdict.sh'
      - '.github/workflows/check-coordinate-scripts.yml'
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/coordinate.list'
      - '.tsuku.toml'
      - 'scripts/assert-koto-floor.sh'
      - 'scripts/check-template-compat.sh'
      - 'scripts/check-template-compat_test.sh'
  push:
    branches: [main]
    # Must match the pull_request paths list above.
    paths:
      - 'skills/coordinate/**'
      - 'scripts/koto-open.sh'
      - 'scripts/skill-preflight.sh'
      - 'scripts/lib/**'
      - 'skills/execute/scripts/merge-exec.sh'
      - 'skills/execute/scripts/merge-verdict.sh'
      - '.github/workflows/check-coordinate-scripts.yml'
      - 'scripts/check-bash-floor.sh'
      - 'scripts/bash-floor/coordinate.list'
      - '.tsuku.toml'
      - 'scripts/assert-koto-floor.sh'
      - 'scripts/check-template-compat.sh'
      - 'scripts/check-template-compat_test.sh'

env:
  GITHUB_TOKEN: ${{ github.token }}

# A newer push to the same pull request supersedes this run, so it is
# cancelled rather than left holding a macOS runner. The group is this
# workflow plus the pull request; any other event groups on its own commit
# and is never cancelled. A push to main has no pull request number, so it
# groups on its commit and runs to the end whatever a pull request does next.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The codec, the check scripts and the write scripts need bash, git and jq,
  # and drive test-local gh and koto stand-ins. run-tests.sh shadows the real
  # gh and koto and unsets the tokens, so a test that reached either fails.
  # Both platforms, to keep the bash 3.2 floor honest on macOS.
  test-coordinate-scripts:
    strategy:
      matrix:
        # No macOS leg while the pull request is a draft (shirabe#1300);
        # scripts/check-macos-floor-legs.sh holds the one copy of this line.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq

      # Linux's own bash 5 runs every offline suite through run-tests.sh. The
      # macOS leg is the floor check, so it goes through the runner in the next
      # step: a bare `bash` on a macOS runner is Homebrew's bash 5, and only
      # /bin/bash is 3.2. A test added here belongs in the `coordinate` suite of
      # scripts/check-bash-floor.sh too.
      - name: Run script tests offline (Linux)
        if: runner.os == 'Linux'
        run: bash skills/coordinate/scripts/run-tests.sh

      # The squash-message builder the land step calls lives in scripts/lib/,
      # outside run-tests.sh's directory, so its suite runs on its own.
      - name: Run squash-message tests (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/lib/squash-message_test.sh

      # The runner refuses a /bin/bash that is not 3.2 and keeps a nested
      # `bash` on 3.2 as well.
      - name: Run the coordinate suite on the bash 3.2 floor (macOS, system bash)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system coordinate

  # Drives real koto: the session-log helper against a skeleton template, the
  # compiled coordinate template, and its routes against a stand-in gh.
  test-coordinate-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tsuku
        uses: tsukumogami/tsuku/.github/actions/setup-tsuku@d45bd520886554384942a6e017908bdf6b8cf0b9  # installs tsuku 0.15.2

      - name: Install koto
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install -y

      # Every engine suite SKIPS with exit 0 when koto is missing, which would
      # report green having asserted nothing. Fail here instead, and also when
      # koto is older than shirabe's floor. The takeover suites run only their
      # refusal on a koto without init --supersede (the floor job's), so this
      # job, which runs them in full, fails on such a koto too.
      - name: Assert koto meets the floor
        run: |
          command -v koto
          bash scripts/assert-koto-floor.sh
          case "$(koto init --help)" in
            *--supersede*) ;;
            *) echo "::error::this koto has no init --supersede, so the takeover suites would run only their refusal"; exit 1 ;;
          esac

      - name: Run engine suites
        run: bash skills/coordinate/scripts/run-tests.sh --engine

  # coordinate.compat.json decides which runs a plugin resumes or imports
  # (coord-log.sh provenance), so a change to the template's structure, or to
  # a script its gates reach, must move it. The judge is the base branch's copy
  # of check-template-compat.sh, so a pull request can't loosen the check it is
  # judged by; a base with no copy yet (the change that adds it) is judged by
  # this change's own, with a notice. On a push the base is the commit before.
  check-template-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tsuku
        uses: tsukumogami/tsuku/.github/actions/setup-tsuku@d45bd520886554384942a6e017908bdf6b8cf0b9  # installs tsuku 0.15.2

      - name: Install koto
        env:
          TSUKU_TELEMETRY: "0"
        run: tsuku install -y

      - name: Test the check
        run: bash scripts/check-template-compat_test.sh

      - name: Check the coordinate template's compat table
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then BASE="origin/$BASE_REF"; else BASE="$BEFORE"; fi
          JUDGE=scripts/check-template-compat.sh
          ARGS=(--template skills/coordinate/koto-templates/coordinate.md)
          if [ -n "$BASE" ] && git cat-file -e "$BASE:scripts/check-template-compat.sh" 2>/dev/null; then
            git show "$BASE:scripts/check-template-compat.sh" > "$RUNNER_TEMP/judge.sh"
            JUDGE="$RUNNER_TEMP/judge.sh"
          else
            echo "::notice::the base has no check-template-compat.sh yet; this change's copy judges it"
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE:skills/coordinate/koto-templates/coordinate.compat.json" 2>/dev/null; then
            git show "$BASE:skills/coordinate/koto-templates/coordinate.compat.json" > "$RUNNER_TEMP/base-table.json"
            ARGS+=(--base-table "$RUNNER_TEMP/base-table.json")
          fi
          bash "$JUDGE" "${ARGS[@]}"
