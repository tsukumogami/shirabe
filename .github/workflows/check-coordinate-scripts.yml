name: Check coordinate scripts

on:
  pull_request:
    paths:
      - 'skills/coordinate/**'
      - 'scripts/check-bash-floor.sh'
      - '.github/workflows/check-coordinate-scripts.yml'

jobs:
  # The dispatch path's scripts need bash, git and jq only: niwa, koto, gh and
  # the record feature's scripts are test-local stand-ins.
  test-coordinate-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run script tests
        run: |
          bash skills/coordinate/scripts/dispatch-common_test.sh
          bash skills/coordinate/scripts/render-brief_test.sh
          bash skills/coordinate/scripts/dispatch-worker_test.sh
          bash skills/coordinate/scripts/wait-target_test.sh
          bash skills/coordinate/scripts/teardown-inventory_test.sh

  # macOS ships bash 3.2 as /bin/bash; a bare `bash` on the runner is a newer
  # Homebrew bash, so the floor runner's system backend puts /bin/bash first.
  floor-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the coordinate suite on macOS /bin/bash
        run: scripts/check-bash-floor.sh --backend system coordinate

  # The same suite inside bash:3.2, where every nested bash is 3.2 too.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the coordinate suite on the bash 3.2 floor
        run: scripts/check-bash-floor.sh --backend docker coordinate
