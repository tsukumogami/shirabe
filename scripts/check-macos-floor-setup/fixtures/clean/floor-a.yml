# A floor workflow whose macOS leg needs setup: jq from brew, and a token in
# the workflow's env. The Linux-only step and the checkout are not setup.
name: floor-a
on: pull_request
env:
  GITHUB_TOKEN: ${{ github.token }}
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq
      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq
      - name: Run the suite (Linux)
        if: runner.os == 'Linux'
        run: bash skills/demo/scripts/one_test.sh
      - name: Run the suite on the floor (macOS)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system demo
