# Passes: no job can run on macOS, and a macOS job that runs no suite (a
# release build) has nothing to prove about the floor.
name: not-macos
on: pull_request
jobs:
  linux-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: bash skills/demo/scripts/one_test.sh
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # A comment naming a suite is not a suite run, so this job needs no floor.
      - name: Build
        run: |
          # skills/demo/scripts/one_test.sh runs in another workflow
          cargo build --release --target ${{ matrix.target }}
