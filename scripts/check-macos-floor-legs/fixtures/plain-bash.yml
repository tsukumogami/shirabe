# Fails: the suite step has no `if`, so the macOS leg runs it on Homebrew's
# bash 5. This is the shape shirabe#416 found in four workflows.
name: plain-bash
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests on both legs
        run: bash skills/demo/scripts/one_test.sh
      - name: Run tests on the floor (macOS)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system demo
