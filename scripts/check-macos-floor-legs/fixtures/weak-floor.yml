# Fails three ways that each look green: the only floor step may fail without
# failing the job, a compound `if` does not limit a step to Linux, and a flag
# before the script does not make `bash` a non-run. A floor call naming a suite
# the registry lacks is reported too.
name: weak-floor
on: pull_request
jobs:
  allowed-to-fail:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/demo/scripts/one_test.sh
      - name: Run tests on the floor (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: scripts/check-bash-floor.sh --backend system demo
  compound-if:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests with a flag
        if: runner.os == 'Linux' || github.event_name == 'push'
        run: bash -e skills/demo/scripts/one_test.sh
      - name: Run tests on the floor (macOS)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system demo nosuch
