# Fails: a suite run by path gets `#!/usr/bin/env bash`, which on a macOS
# runner is Homebrew's bash 5. The chained form is caught too, after `cd` and
# an environment prefix.
name: by-path
on: pull_request
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run a suite by path
        run: skills/demo/scripts/one_test.sh
      - name: Run a chained suite
        run: cd skills/demo && EVAL_SCENARIO=x bash scripts/two_test.sh
      - name: Run tests on the floor
        run: scripts/check-bash-floor.sh --backend system demo
