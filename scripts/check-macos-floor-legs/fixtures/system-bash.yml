# Fails: /bin/bash puts the harness on 3.2, but a nested `bash` inside it still
# finds Homebrew's bash 5.
name: system-bash
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (macOS, system bash 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash skills/demo/scripts/one_test.sh
      - name: Run tests on the floor (macOS)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system demo
