# Passes: Linux runs its suites with bash, the macOS leg reaches the floor
# through the runner, and the installer pipe and bash -c are not suite runs.
# The macOS leg waits for a draft pull request to be marked ready.
name: clean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tsuku
        run: |
          curl -fsSL https://get.tsuku.dev/now | bash
          echo "$HOME/.tsuku/bin" >> "$GITHUB_PATH"
      - name: Report the shell
        run: bash -c 'echo "$BASH_VERSION"'
      - name: Assert koto meets the floor
        run: scripts/assert-koto-floor.sh
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: |
          bash skills/demo/scripts/one_test.sh
          bash skills/demo/scripts/two_test.sh
      - name: Run tests on the floor (macOS)
        if: runner.os == 'macOS'
        run: scripts/check-bash-floor.sh --backend system demo
